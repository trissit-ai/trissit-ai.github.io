<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flux AI Proposal · Res</title>
<style>
:root{
  --bg:#F7F9FB; --panel:#FFFFFF; --ink:#061F32; --ink2:#44546A; --mut:#8A96A3;
  --line:#DDE3EA; --bronze:#C99A5B; --bronze2:#E3B87C; --lime:#C6F24E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0B1118;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;color:var(--ink);overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0B1118}
#stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:var(--bg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease;background:var(--bg)}
.page.active{opacity:1;pointer-events:auto}
.page video.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim-b{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none}
.scrim-dark{background:linear-gradient(to top,rgba(4,10,16,.82) 0%,rgba(4,10,16,.45) 55%,transparent 100%)}
.scrim-light{background:linear-gradient(to top,rgba(247,249,251,.94) 0%,rgba(247,249,251,.55) 55%,transparent 100%)}
/* 章节/封面：文字居中压到构图下方，且避开底部字幕 */
.chapter-text{position:absolute;left:0;right:0;bottom:15.5%;text-align:center;padding:0 8%;z-index:3}
.chapter-text .kick{font-size:clamp(10px,1.1vw,15px);letter-spacing:.42em;color:var(--bronze2);text-transform:uppercase;margin-bottom:1.1em;font-weight:600}
.chapter-text h1{font-size:clamp(26px,3.4vw,52px);font-weight:700;letter-spacing:.06em;line-height:1.25}
.chapter-text .sub{margin-top:1em;font-size:clamp(12px,1.25vw,18px);letter-spacing:.12em;opacity:.85}
.on-dark{color:#F4F7FA}.on-dark .sub{color:#C7D2DC}
.on-light{color:var(--ink)}.on-light .sub{color:var(--ink2)}
.on-light .kick{color:var(--bronze)}
/* 内容页通用 */
.content{position:absolute;inset:0;padding:4.2% 5.2% 9.5%;display:flex;flex-direction:column}
.p-head{display:flex;align-items:baseline;gap:1.2em;border-bottom:1px solid var(--line);padding-bottom:1.6%;margin-bottom:2.2%}
.p-num{font-size:clamp(11px,1vw,14px);letter-spacing:.3em;color:var(--bronze);font-weight:700;white-space:nowrap}
.p-title{font-size:clamp(18px,2vw,30px);font-weight:700;letter-spacing:.02em}
.p-sub{font-size:clamp(11px,1.05vw,15px);color:var(--mut);margin-left:auto;text-align:right;max-width:40%}
.src{position:absolute;bottom:4.6%;left:5.2%;right:5.2%;font-size:clamp(8px,.75vw,11px);color:var(--mut);letter-spacing:.02em}
.cards{display:flex;gap:2%;flex:1;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:3% 2.6%;flex:1;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(6,31,50,.05)}
.card .tag{font-size:clamp(9px,.85vw,12px);letter-spacing:.28em;color:var(--bronze);font-weight:700;margin-bottom:.9em}
.card h3{font-size:clamp(15px,1.5vw,22px);font-weight:700;margin-bottom:.6em}
.card p{font-size:clamp(10px,1vw,15px);line-height:1.75;color:var(--ink2)}
.card .en{font-size:clamp(8px,.75vw,11px);letter-spacing:.22em;color:var(--mut);margin-bottom:.4em}
.bignum{font-size:clamp(40px,5.4vw,84px);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.bignum.bronze{color:var(--bronze)}
.foot-note{margin-top:auto;padding-top:2%;border-top:1px dashed var(--line);font-size:clamp(10px,1vw,15px);color:var(--ink2);line-height:1.7}
.hl{color:var(--bronze);font-weight:700}
/* ===== 黑底 · 白字 · 绿高亮（P7-P9） ===== */
.sec-g{background:#05090D;color:#F2F6F3}
.sec-g .p-head{border-color:#1B2822}
.sec-g .p-num{color:#9BD65B}
.sec-g .p-title{color:#F2F6F3}
.sec-g .p-sub{color:#7E938A}
.sec-g .card{background:#0B1210;border-color:#1F2E26;box-shadow:none}
.sec-g .card .tag{color:#9BD65B}
.sec-g .card h3{color:#F2F6F3}
.sec-g .card p{color:#A9BCB2}
.sec-g .card .en{color:#64796E}
.sec-g .card p b{color:#E4F2D8}
.sec-g .foot-note{border-color:#1F2E26;color:#A9BCB2}
.sec-g .foot-note b{color:#E4F2D8}
.sec-g .hl{color:#C6F24E}
.sec-g .src{color:#54675D}
.sec-g .case-logo{background:#101815;border:1px solid #1F2E26}
.sec-g .case-metrics{border-color:#1F2E26}
.sec-g .case-metrics b{color:#C6F24E}
.sec-g .case-metrics span{color:#64796E}
.sec-g .ai-before{background:#15201A;color:#7E938A}
.sec-g .ai-after{background:rgba(198,242,78,.13);color:#C6F24E}
/* ===== 黑底 · 白字 · 橙高亮（P11-P14） ===== */
.sec-o{background:#0A0908;color:#FAF6F0}
.sec-o .p-head{border-color:#2A2115}
.sec-o .p-num{color:#F08C2E}
.sec-o .p-title{color:#FAF6F0}
.sec-o .p-sub{color:#A08F7A}
.sec-o .card{background:#120F0B;border-color:#2C2214;box-shadow:none}
.sec-o .card .tag{color:#F08C2E}
.sec-o .card h3{color:#FAF6F0}
.sec-o .card p{color:#B9AA97}
.sec-o .card p b{color:#F0DFC8}
.sec-o .card .en{color:#7A6A54}
.sec-o .foot-note{border-color:#2C2214;color:#B9AA97}
.sec-o .foot-note b{color:#F0DFC8}
.sec-o .hl{color:#F5A95C}
.sec-o .src{color:#6B5C47}
.sec-o .flow3 .fnode{background:#120F0B;border-color:#2C2214;color:#FAF6F0}
.sec-o .flow3 .fnode.hot{border-color:#F08C2E;color:#F5A95C}
.sec-o .flow3 .arr{color:#7A6A54}
/* ===== 深灰底 · 白字 · 古铜金高亮（P17-P22） ===== */
.sec-b{background:#1D232B;color:#F4F7FA}
.sec-b .p-head{border-color:#38424E}
.sec-b .p-num{color:#E3B87C}
.sec-b .p-title{color:#F4F7FA}
.sec-b .p-sub{color:#8B99A8}
.sec-b .card{background:#262E38;border-color:#3B4654;box-shadow:none}
.sec-b .card .tag{color:#E3B87C}
.sec-b .card h3{color:#F4F7FA}
.sec-b .card p{color:#AAB7C4}
.sec-b .card p b{color:#E8EEF4}
.sec-b .card .en{color:#6E7C8C}
.sec-b .foot-note{border-color:#3B4654;color:#AAB7C4}
.sec-b .foot-note b{color:#E8EEF4}
.sec-b .hl{color:#E3B87C}
.sec-b .src{color:#5E6B7A}
.sec-b .longquote{background:#262E38;border-color:#3B4654}
.sec-b .longquote .who{color:#E3B87C}
.sec-b .longquote p{color:#AAB7C4}
.sec-b .longquote p b{color:#E8EEF4}
.sec-b .chain .cnode{background:#262E38;border-color:#3B4654}
.sec-b .chain .cnode b{color:#F4F7FA}
.sec-b .chain .cnode span{color:#8B99A8}
.sec-b .chain .carr{color:#E3B87C}
.sec-b .chain .crow-title{color:#C7D2DC}
.sec-b .bignum{color:#F4F7FA}
.sec-b .bignum.bronze{color:#E3B87C}
/* P2 */
.p2-grid{display:flex;gap:3%;flex:1;min-height:0}
.p2-left{display:flex;flex-direction:column;gap:3%;width:44%}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:5% 6%;flex:1;display:flex;flex-direction:column;justify-content:center}
.stat-card .lab{font-size:clamp(10px,1vw,15px);color:var(--ink2);margin-top:.8em;line-height:1.5}
.p2-chart{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:3.5%;display:flex;flex-direction:column}
.p2-chart .cap{font-size:clamp(10px,1vw,14px);color:var(--ink2);margin-bottom:2%}
.bridge-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
/* P7 案例 */
.case-card{display:flex;flex-direction:column}
.case-logo{height:17%;min-height:56px;display:flex;align-items:center;justify-content:center;background:#0B1118;border-radius:.8vh;margin-bottom:4%;overflow:hidden}
.case-logo img{width:100%;height:100%;object-fit:cover}
.case-logo img.contain{object-fit:contain;max-height:82%;max-width:80%}
.case-metrics{display:flex;gap:4%;margin-top:auto;padding-top:3%;border-top:1px solid var(--line)}
.case-metrics div{flex:1;text-align:center}
.case-metrics b{display:block;font-size:clamp(15px,1.7vw,26px);color:var(--bronze);font-weight:800}
.case-metrics span{font-size:clamp(8px,.8vw,11px);color:var(--mut)}
.ai-tag{display:inline-block;font-size:clamp(8px,.75vw,11px);letter-spacing:.2em;padding:.2em .8em;border-radius:2em;margin-bottom:.5em}
.ai-before{background:#F2F4F7;color:var(--mut)}
.ai-after{background:rgba(201,154,91,.15);color:var(--bronze);font-weight:700}
/* P12 人才结构（按 PPT 横向流式） */
.org-flow{flex:1;display:flex;align-items:stretch;gap:1.5%;min-height:0}
.org-col{flex:1.15;display:flex;flex-direction:column;gap:1.4vh}
.org-col.mid{flex:1.5}
.org-pill{text-align:center;font-size:clamp(10px,1vw,15px);font-weight:700;letter-spacing:.18em;color:#F5A95C;border:1px solid #2C2214;background:#120F0B;border-radius:2em;padding:2.2% 0}
.org-box{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;background:#120F0B;border:1px solid #2C2214;border-radius:1.2vh;font-size:clamp(14px,1.6vw,24px);font-weight:700;color:#FAF6F0;letter-spacing:.06em;padding:4% 6%}
.org-box.keep{border-color:#F08C2E;color:#F5A95C}
.org-arrow{flex:.5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh}
.org-arrow .ln{width:100%;border-top:2px solid #4A3A22;position:relative}
.org-arrow .ln::after{content:"";position:absolute;right:-1px;top:-6px;border:5px solid transparent;border-left:8px solid #4A3A22}
.org-arrow .zh{width:clamp(26px,2.6vw,40px);height:clamp(26px,2.6vw,40px);border-radius:50%;border:1.5px solid #F08C2E;color:#F5A95C;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1vw,15px);font-weight:700;background:#0A0908}
/* P15 流程 */
.flow3{display:flex;align-items:center;gap:1.5%;margin-bottom:3%}
.flow3 .fnode{flex:1;text-align:center;padding:1.6% 0;border:1px solid var(--line);border-radius:1vh;background:var(--panel);font-size:clamp(13px,1.4vw,21px);font-weight:700;letter-spacing:.15em}
.flow3 .fnode.hot{border-color:var(--bronze);color:var(--bronze)}
.flow3 .arr{color:var(--mut);font-size:clamp(14px,1.6vw,24px)}
/* P19 双链 */
.chain{display:flex;align-items:center;gap:1.2%;margin:2.2% 0}
.chain .cnode{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:1vh;padding:2.2% 1%}
.chain .cnode b{display:block;font-size:clamp(14px,1.5vw,23px);margin-bottom:.3em}
.chain .cnode span{font-size:clamp(8px,.8vw,12px);color:var(--mut);line-height:1.5;display:block}
.chain .carr{color:var(--bronze);font-size:clamp(12px,1.3vw,20px)}
.chain .crow-title{width:7%;font-size:clamp(10px,1vw,15px);font-weight:700;color:var(--ink2);letter-spacing:.1em}
/* P20 履历 */
.career{position:absolute;top:0;bottom:calc(4.84% + 4px);right:0;width:46%;padding:4.2% 4% 0 3%;display:flex;flex-direction:column;z-index:3}
.career .inner{background:rgba(29,35,43,.82);backdrop-filter:blur(10px);border:1px solid rgba(227,184,124,.3);border-radius:1.4vh;padding:3.6% 5%;flex:1;display:flex;flex-direction:column;overflow:hidden}
.career h2{color:#F4F7FA;font-size:clamp(15px,1.6vw,24px);margin-bottom:.4em}
.career .cap{color:var(--bronze2);font-size:clamp(9px,.9vw,13px);letter-spacing:.1em;margin-bottom:1em}
.job{border-left:2px solid rgba(227,184,124,.4);padding:0 0 0 4%;margin-bottom:3%}
.job b{display:block;color:#F4F7FA;font-size:clamp(11px,1.15vw,17px)}
.job i{display:block;color:var(--bronze2);font-style:normal;font-size:clamp(8px,.8vw,12px);margin:.3em 0}
.job span{color:#AEB9C6;font-size:clamp(8px,.85vw,12.5px);line-height:1.6}
/* P21 项目（无图重排） */
.proj-num{font-size:clamp(34px,4vw,62px);font-weight:800;color:rgba(227,184,124,.28);line-height:1;margin-bottom:.2em}
/* P22 地图 */
.mapbg{position:absolute;inset:0;background:#050B12}
.mapbg img{width:100%;height:100%;object-fit:cover;opacity:.9;filter:brightness(.5) contrast(1.05)}
.map-chips{position:absolute;left:0;right:0;bottom:16%;display:flex;justify-content:center;gap:2%;z-index:3;padding:0 6%}
.map-chip{background:rgba(29,35,43,.85);border:1px solid rgba(227,184,124,.35);backdrop-filter:blur(8px);border-radius:1.2vh;padding:2.2% 3%;flex:1;text-align:center}
.map-chip b{display:block;color:var(--bronze2);font-size:clamp(13px,1.4vw,21px);margin-bottom:.4em;letter-spacing:.1em}
.map-chip span{color:#C7D2DC;font-size:clamp(9px,.9vw,13px);line-height:1.6}
.map-head{position:absolute;top:7%;left:0;right:0;text-align:center;z-index:3}
.map-head h2{color:#F4F7FA;font-size:clamp(20px,2.4vw,36px);letter-spacing:.05em}
.map-head p{color:#AEB9C6;font-size:clamp(10px,1.05vw,15px);margin-top:.8em;letter-spacing:.08em}
/* P17 引言 */
.quote-page{position:absolute;inset:0;background:#0B1118}
.quote-page img.qbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.quote-block{position:absolute;right:6%;bottom:16%;text-align:right;z-index:3;max-width:52%}
.quote-block .en{color:var(--bronze2);font-size:clamp(11px,1.15vw,17px);letter-spacing:.14em;margin-bottom:1em;font-style:italic}
.quote-block .cn{color:#F4F7FA;font-size:clamp(18px,2.2vw,34px);font-weight:700;line-height:1.5;letter-spacing:.04em}
.quote-block .role{position:absolute;right:0;top:-5.5em;color:rgba(244,247,250,.4);font-size:clamp(10px,1vw,14px);letter-spacing:.4em}
/* P18 长引言 */
.longquote{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:3.5% 4.5%}
.longquote .who{font-size:clamp(11px,1.1vw,16px);color:var(--bronze);font-weight:700;margin-bottom:1.2em;letter-spacing:.05em}
.longquote p{font-size:clamp(12px,1.35vw,20px);line-height:2;color:var(--ink2)}
/* Q&A */
.qa{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1D232B 0%,#161C23 100%)}
.qa .big{font-size:clamp(60px,9vw,150px);font-weight:800;letter-spacing:.04em;color:#F4F7FA;line-height:1}
.qa .line{width:8%;height:3px;background:var(--bronze2);margin:3% 0}
.qa .en{font-size:clamp(13px,1.5vw,23px);letter-spacing:.34em;color:#E3B87C;text-transform:uppercase}
.qa .cn{margin-top:1.4em;font-size:clamp(11px,1.15vw,17px);color:#8B99A8;letter-spacing:.2em}
/* 底部控制条 */
#hud{position:absolute;left:0;right:0;bottom:0;height:4.84%;min-height:38px;background:rgba(8,14,21,.88);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 1.2%;gap:1%;z-index:20;color:#C7D2DC;font-size:clamp(10px,.94vw,13.5px)}
#hud button{background:none;border:1px solid rgba(199,210,220,.3);color:#C7D2DC;border-radius:.6vh;padding:.3em 1em;font-size:inherit;cursor:pointer;letter-spacing:.08em;display:inline-flex;align-items:center;gap:.5em}
#hud button:hover{border-color:var(--bronze2);color:var(--bronze2)}
#subtitle{position:absolute;left:8%;right:8%;bottom:7%;text-align:center;z-index:15;pointer-events:none}
#subtitle span{display:inline-block;background:rgba(8,14,21,.45);color:#F4F7FA;padding:.5em 1.2em;border-radius:2em;font-size:clamp(12px,1.3vw,20px);letter-spacing:.04em;line-height:1.5;opacity:0;transition:opacity .25s}
#subtitle.on span{opacity:1}
#progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--bronze),var(--bronze2));width:0%;z-index:21;transition:width .3s linear}
#pageind{margin-left:auto;letter-spacing:.15em;color:var(--mut)}
#ptitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44%;color:#8A96A3}
#menu{position:absolute;top:0;right:0;bottom:0;width:26%;background:rgba(8,14,21,.96);z-index:30;transform:translateX(102%);transition:transform .35s ease;overflow-y:auto;padding:3% 3.5%}
#menu.open{transform:translateX(0)}
#menu h4{color:var(--bronze2);letter-spacing:.3em;font-size:12px;margin-bottom:1.2em}
#menu .mi{color:#C7D2DC;padding:.7em .4em;border-bottom:1px solid rgba(199,210,220,.12);cursor:pointer;font-size:clamp(10px,.95vw,13px);display:flex;gap:.8em}
#menu .mi:hover{color:var(--bronze2)}
#menu .mi b{color:var(--mut);font-weight:400;min-width:2.2em}

/* ===== 竖屏自适应 ===== */
@media (max-aspect-ratio: 3/4){
  #stage{width:100vw;height:100vh;height:100dvh;box-shadow:none}
  .content{padding:5% 5% 15%;overflow-y:auto;display:flex;flex-direction:column}
  .content>*{flex:none}
  .p-head{flex-wrap:wrap}
  .p-sub{display:none}
  .p-title{font-size:19px}
  .cards{flex-direction:column!important;gap:14px}
  .card{padding:5% 4.5%}
  .p2-grid{flex-direction:column;gap:14px}
  .p2-left{width:100%;flex-direction:row;gap:3%}
  .p2-chart{min-height:250px}
  .bridge-wrap{min-height:330px}
  .bridge-h{display:none!important}
  .bridge-v{display:block!important;margin:0 auto}
  .flow3 .fnode{font-size:13px;padding:3% 0}
  .org-flow{flex-direction:column;gap:10px}
  .org-col{gap:8px}
  .org-box{min-height:58px;padding:12px 6%;font-size:16px}
  .org-arrow{flex-direction:row;padding:0}
  .org-arrow .ln{display:none}
  .org-arrow::after{content:"↓";color:#4A3A22;font-size:16px}
  .chain{flex-direction:column;align-items:stretch;gap:8px;margin:2% 0}
  .chain .carr{display:none}
  .chain .crow-title{width:auto;letter-spacing:.2em}
  .chain .cnode{padding:3.5% 3%}
  .case-logo{height:76px}
  .case-metrics{margin-top:14px;padding-top:10px}
  .sec-o .card svg{height:170px}
  .career{width:100%;left:0;right:0;bottom:calc(100px + 4px);padding:5% 5% 0}
  .career .inner{overflow-y:auto}
  .map-chips{flex-direction:column;gap:8px;bottom:11%;max-height:56%;overflow-y:auto;padding:0 5%}
  .map-chip{padding:3.5% 4%}
  .map-head{top:5%}
  .quote-block{left:6%;right:6%;max-width:none;bottom:14%}
  .quote-block .role{position:static;display:block;margin-bottom:1em}
  .chapter-text{bottom:12%;padding:0 6%}
  .longquote{overflow-y:auto}
  .foot-note{margin-top:14px}
  .src{position:static;margin-top:12px}
  .proj-num{font-size:34px}
  #subtitle{bottom:9%;left:4%;right:4%}
  #hud{flex-wrap:wrap;height:auto;min-height:46px;padding:6px 2%;row-gap:6px}
  #ptitle{display:none}
  #pageind{margin-left:auto}
  #menu{width:78%}
}

/* ===== 微动效 ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes shimmer{to{background-position:200% 0}}
.bridge-v{display:none}
.page.active :is(.cards,.p2-left,.chain,.org-flow,.map-chips,.flow3)>*,

<script id="cuedata" type="application/json">{"pages": [{"n": 1, "title": "封面：Flux", "start": 0.0, "dur": 20.516, "cues": [{"t": 0.0, "s": "各位好。", "e": 1.368}, {"t": 2.188, "s": "今天我要讲的，不是又一个AI概念，", "e": 5.644}, {"t": 6.014, "s": "而是一个落地计划——Flux企业AI落地计划。", "e": 9.854}, {"t": 10.224, "s": "Flux，就是渗透的意思。", "e": 12.816}, {"t": 13.186, "s": "这个计划只做一件事：让AI从演示厅里走出来，", "e": 17.578}, {"t": 17.948, "s": "渗进企业的真实业务里。", "e": 20.396}]}, {"n": 2, "title": "危机：一半企业还站在岸上", "start": 20.966, "dur": 33.732, "cues": [{"t": 0.0, "s": "先看一组扎心的数据。", "e": 2.256}, {"t": 2.626, "s": "MIT的调研显示：已经有近40%的组织部署了通用大模型工具；", "e": 8.146}, {"t": 8.516, "s": "但真正进入生产阶段的企业级定制AI系统，", "e": 12.5}, {"t": 12.87, "s": "只有5%。", "e": 14.67}, {"t": 15.49, "s": "通用工具人人都在用，", "e": 17.938}, {"t": 18.308, "s": "可一碰到企业自己的业务，", "e": 20.948}, {"t": 21.318, "s": "几乎全军覆没。", "e": 23.334}, {"t": 23.704, "s": "更要命的是，AI的能力按季度翻倍，", "e": 27.208}, {"t": 27.578, "s": "企业的采用曲线却几乎走平。", "e": 30.482}, {"t": 30.852, "s": "这个缺口，不会自己合上。", "e": 33.612}]}, {"n": 3, "title": "趋势：跑通的大厂都有同一个角色", "start": 55.148, "dur": 31.682, "cues": [{"t": 0.0, "s": "那跑通AI的大厂，做对了什么？", "e": 3.048}, {"t": 3.418, "s": "答案出奇一致：它们都设了同一个角色。", "e": 6.97}, {"t": 7.34, "s": "这个角色在大厂AI化组织里已是标配，", "e": 11.036}, {"t": 11.406, "s": "近一年还在持续扩张。", "e": 13.83}, {"t": 14.2, "s": "因为当AI已经能替代大量开发工作时，", "e": 17.536}, {"t": 17.906, "s": "企业缺的不是技术，", "e": 19.922}, {"t": 20.292, "s": "而是一个帮企业完成AI化改造的人。", "e": 23.7}, {"t": 24.52, "s": "竞对在跑、大厂在跑——这已经不是要不要做的问题，", "e": 28.936}, {"t": 29.306, "s": "而是多快做对的问题。", "e": 31.562}]}, {"n": 4, "title": "信号：两大巨头同一天押注", "start": 87.28, "dur": 36.862, "cues": [{"t": 0.0, "s": "二零二六年五月四日，", "e": 2.208}, {"t": 2.578, "s": "发生了标志性的一幕：", "e": 4.882}, {"t": 5.252, "s": "OpenAI和Anthropic，", "e": 7.412}, {"t": 7.782, "s": "在同一天，押注了同一件事——帮AI进入企业。", "e": 11.886}, {"t": 12.256, "s": "OpenAI成立DeploymentCompany，募资四十亿、估值一百亿美元；", "e": 16.528}, {"t": 16.898, "s": "Anthropic联合黑石、高盛，做了十五亿美元的企业AI合资公司。", "e": 22.034}, {"t": 22.404, "s": "而支撑这套打法的驻场工程师岗位，", "e": 25.668}, {"t": 26.038, "s": "去年前九个月招聘量暴涨超过800%。", "e": 29.854}, {"t": 30.674, "s": "资本已经投票了：", "e": 32.666}, {"t": 33.036, "s": "AI的下半场，", "e": 34.764}, {"t": 35.134, "s": "拼的是落地。", "e": 36.742}]}, {"n": 5, "title": "跛局：两条腿走路，需要一座桥", "start": 124.592, "dur": 33.228, "cues": [{"t": 0.0, "s": "那企业自己要怎么落地？", "e": 2.448}, {"t": 2.818, "s": "目前被验证最有效的，是两条腿：", "e": 6.034}, {"t": 6.404, "s": "第一，定制出合用的AI工具——不是采购现成品，", "e": 10.364}, {"t": 10.734, "s": "而是贴着业务定制工作流；", "e": 13.182}, {"t": 13.552, "s": "第二，推行全员使用——不是发账号就完事，", "e": 17.176}, {"t": 17.546, "s": "而是排除障碍、教会全员、用数据度量。", "e": 21.338}, {"t": 22.158, "s": "但这两条腿之间，", "e": 24.27}, {"t": 24.64, "s": "隔着一条沟。", "e": 26.296}, {"t": 26.666, "s": "沟的两岸，是懂业务的人，和AI的能力。", "e": 30.338}, {"t": 30.708, "s": "这中间，需要一座桥。", "e": 33.108}]}, {"n": 6, "title": "章节：Flood 浪潮", "start": 158.27, "dur": 20.358, "cues": [{"t": 0.0, "s": "这座桥一旦架起来，", "e": 2.16}, {"t": 2.53, "s": "接下来的就不是细水长流，", "e": 5.266}, {"t": 5.636, "s": "而是一场浪潮。", "e": 7.364}, {"t": 8.184, "s": "全球大厂在一年半前已经开始布局AI化。", "e": 11.88}, {"t": 12.25, "s": "这股洪水正在冲向每一家企业。", "e": 15.298}, {"t": 15.668, "s": "问题只剩下一个：", "e": 17.708}, {"t": 18.078, "s": "我们，要怎么准备？", "e": 20.238}]}, {"n": 7, "title": "验证：三个行业已经跑通", "start": 179.078, "dur": 43.352, "cues": [{"t": 0.0, "s": "先看别人已经跑通的样子。", "e": 2.64}, {"t": 3.01, "s": "营销端，三星把单向广告变成AI对话推荐，", "e": 7.378}, {"t": 7.748, "s": "互动成本降了54%，获客成本降了73%，广告回报翻了三倍。", "e": 13.508}, {"t": 13.878, "s": "零售端，Zara用RFID加AI实时调度库存，", "e": 18.198}, {"t": 18.568, "s": "季末库存压到0.6%，", "e": 21.376}, {"t": 21.746, "s": "而行业还在百分之十到二十。", "e": 24.578}, {"t": 24.948, "s": "售后端，Target给店员配了AI助手，", "e": 28.428}, {"t": 28.798, "s": "上线三周，被问了五万多次。", "e": 31.75}, {"t": 32.57, "s": "三个行业，三个模块，", "e": 35.09}, {"t": 35.46, "s": "全是先跑通一个种子案例，", "e": 37.932}, {"t": 38.302, "s": "再复制。", "e": 39.694}, {"t": 40.064, "s": "这，就是浪潮已经上岸的证据。", "e": 43.232}]}, {"n": 8, "title": "回扣：桥，就是落地方法论", "start": 222.88, "dur": 27.344, "cues": [{"t": 0.0, "s": "看完案例再回头看这张图，", "e": 2.808}, {"t": 3.178, "s": "逻辑就非常清楚了。", "e": 5.338}, {"t": 5.708, "s": "三星、Zara、Target，", "e": 8.204}, {"t": 8.574, "s": "没有一家是靠买工具买出来的，", "e": 11.478}, {"t": 11.848, "s": "全都是定制工具加全员推行，两条腿一起走。", "e": 15.952}, {"t": 16.322, "s": "而连接这两条腿的桥，", "e": 18.602}, {"t": 18.972, "s": "就是一套落地的操作方法。", "e": 21.516}, {"t": 21.886, "s": "这套方法，", "e": 23.446}, {"t": 23.816, "s": "就是我们今天要讲的Flux计划的内核。", "e": 27.224}]}, {"n": 9, "title": "回扣：巨头的钱流向同一个方向", "start": 250.674, "dur": 56.284, "cues": [{"t": 0.0, "s": "再回头看巨头的动作。", "e": 2.424}, {"t": 2.794, "s": "四十亿美元和十五亿美元，", "e": 5.602}, {"t": 5.972, "s": "买的不是模型，", "e": 7.748}, {"t": 8.118, "s": "而是把AI送进企业的能力。", "e": 10.758}, {"t": 11.128, "s": "OpenAI一次收购就引入约一百五十名落地工程师。", "e": 15.016}, {"t": 15.386, "s": "这说明什么？", "e": 17.066}, {"t": 17.436, "s": "说明这套「驻场、贴业务、交付结果」的打法，", "e": 21.372}, {"t": 21.742, "s": "已经被最顶级的玩家用钱验证过了。", "e": 25.126}, {"t": 25.496, "s": "我们要做的，", "e": 27.272}, {"t": 27.642, "s": "是把它变成自己的计划。", "e": 30.042}, {"t": 30.612, "s": "所以这三张标签，", "e": 32.82}, {"t": 33.19, "s": "现在可以读得更直白：", "e": 35.59}, {"t": 35.96, "s": "已被验证，是大厂组织架构里的标配；", "e": 39.56}, {"t": 39.93, "s": "正在扩张，是招聘数据里的八百个百分点；", "e": 43.602}, {"t": 43.972, "s": "时代共识，是两大巨头同一天的下注。", "e": 47.62}, {"t": 48.44, "s": "桥的价值已经被证明。", "e": 50.888}, {"t": 51.258, "s": "接下来的问题变成了：", "e": 53.514}, {"t": 53.884, "s": "这座桥，我们怎么造？", "e": 56.164}]}, {"n": 11, "title": "章节：Flux 定制级 AI Native 方案", "start": 307.408, "dur": 17.66, "cues": [{"t": 0.0, "s": "答案就是Flux。", "e": 1.872}, {"t": 2.692, "s": "一套定制级的AINative方案。", "e": 5.428}, {"t": 5.798, "s": "目标一句话：", "e": 7.502}, {"t": 7.872, "s": "让AI渗透到业务的基准线。", "e": 10.584}, {"t": 10.954, "s": "不是做几个炫酷的演示，", "e": 13.33}, {"t": 13.7, "s": "而是让AI变成业务每天都离不开的底层能力。", "e": 17.54}]}, {"n": 12, "title": "方法：Flux 的三种职能", "start": 325.518, "dur": 43.732, "cues": [{"t": 0.0, "s": "Flux怎么落地？", "e": 1.824}, {"t": 2.194, "s": "靠三种职能。", "e": 4.066}, {"t": 4.436, "s": "第一，渗透剂：从细分业务切入，", "e": 7.676}, {"t": 8.046, "s": "把方法渗进一线每天的动作里，", "e": 10.926}, {"t": 11.296, "s": "让个人经验蒸馏成组织资产。", "e": 14.344}, {"t": 14.714, "s": "第二，催化剂：用AI啃透一个业务，", "e": 18.218}, {"t": 18.588, "s": "把成功案例凝成模板，", "e": 20.892}, {"t": 21.262, "s": "再逐个复制，", "e": 23.086}, {"t": 23.456, "s": "让交付周期持续缩短。", "e": 25.904}, {"t": 26.274, "s": "第三，离析剂：全员拉齐AI基线，", "e": 29.754}, {"t": 30.124, "s": "用「使用量乘业务产出」双维度看数据，", "e": 33.388}, {"t": 33.758, "s": "最终标定出——谁该上、谁该下。", "e": 36.686}, {"t": 37.506, "s": "渗透、催化、离析，", "e": 40.05}, {"t": 40.42, "s": "三步走完，业务就变成了AINative。", "e": 43.612}]}, {"n": 13, "title": "前瞻：AI 时代的人才结构", "start": 369.7, "dur": 35.71, "cues": [{"t": 0.0, "s": "顺着离析剂再往深看一层：", "e": 2.856}, {"t": 3.226, "s": "AI时代的人才结构会怎么变？", "e": 6.106}, {"t": 6.476, "s": "世界经济论坛的判断是，", "e": 8.996}, {"t": 9.366, "s": "人的价值会集中到四个动作上：", "e": 12.414}, {"t": 12.784, "s": "定义问题、设定约束、评估结果、做最终决策。", "e": 17.176}, {"t": 17.996, "s": "也就是说，", "e": 19.532}, {"t": 19.902, "s": "中段那些重复的、执行性的任务，", "e": 23.334}, {"t": 23.704, "s": "会被AI吃掉；", "e": 25.576}, {"t": 25.946, "s": "人的时间，要往两端搬。", "e": 28.538}, {"t": 28.908, "s": "所以Flux要做的不是筛人，", "e": 31.428}, {"t": 31.798, "s": "而是把同一个人的时间，从中段搬到两端。", "e": 35.59}]}, {"n": 14, "title": "种子：第一个战场，海外销售端", "start": 405.86, "dur": 44.034, "cues": [{"t": 0.0, "s": "方法有了，第一仗打在哪？", "e": 2.592}, {"t": 2.962, "s": "Flux的第一个种子，", "e": 4.954}, {"t": 5.324, "s": "选在海外销售端。", "e": 7.508}, {"t": 7.878, "s": "三个理由。", "e": 9.342}, {"t": 9.712, "s": "第一，痛点最痛：全球跨语言、跨时区、跨渠道，", "e": 14.248}, {"t": 14.618, "s": "报价、会议、资料同步大量靠人肉搬运。", "e": 18.53}, {"t": 18.9, "s": "第二，价值可验证：销售端最接近用户，", "e": 22.74}, {"t": 23.11, "s": "AI的产出直接换算成订单、转化率、响应时间，", "e": 27.238}, {"t": 27.608, "s": "当天就看得见。", "e": 29.408}, {"t": 29.778, "s": "第三，闭环可复制：现场洞察反哺产品，", "e": 33.57}, {"t": 33.94, "s": "能力沿着营销、渠道、交付、风控、售后流向相邻环节。", "e": 39.316}, {"t": 40.136, "s": "跑通一个点，", "e": 41.744}, {"t": 42.114, "s": "复制一张网。", "e": 43.914}]}, {"n": 15, "title": "总结：Floe → Flood → Flux", "start": 450.344, "dur": 36.958, "cues": [{"t": 0.0, "s": "总结一下整条线：", "e": 2.016}, {"t": 2.386, "s": "从浮冰，", "e": 3.826}, {"t": 4.196, "s": "到洪水，", "e": 5.612}, {"t": 5.982, "s": "到Flux。", "e": 7.374}, {"t": 8.194, "s": "这个计划最终交付四个改变：", "e": 10.93}, {"t": 11.3, "s": "业务提效——AI介入前后，数据可度量、可归因；", "e": 15.524}, {"t": 15.894, "s": "人才标定——谁能管理AI，谁可以被替代，标签从模糊变精准；", "e": 21.102}, {"t": 21.472, "s": "资产沉淀——经验沉淀为公司资产，人来人走，业务质量不变；", "e": 26.992}, {"t": 27.362, "s": "流程清晰——含糊拖慢的业务流，被重新梳理得高效清晰。", "e": 32.066}, {"t": 32.436, "s": "这，", "e": 33.684}, {"t": 34.054, "s": "就是Flux企业AI落地计划。", "e": 36.838}]}, {"n": 16, "title": "结尾：让 AI 在业务里真正产出价值", "start": 487.752, "dur": 22.504, "cues": [{"t": 0.0, "s": "一句话收尾：", "e": 1.8}, {"t": 2.17, "s": "让AI在业务里真正产出价值。", "e": 5.29}, {"t": 6.11, "s": "今天的分享就到这里，", "e": 8.462}, {"t": 8.832, "s": "哪一页希望展开讨论，我们随时可以深聊。", "e": 12.528}, {"t": 12.898, "s": "接下来的时间，", "e": 14.698}, {"t": 15.068, "s": "请允许我用几页，", "e": 17.228}, {"t": 17.598, "s": "介绍一下我自己——", "e": 19.542}, {"t": 19.912, "s": "为什么是我，来做Flux。", "e": 22.384}]}, {"n": 17, "title": "章节：The Role", "start": 510.706, "dur": 21.006, "cues": [{"t": 0.0, "s": "先说我对自己角色的理解。", "e": 2.64}, {"t": 3.01, "s": "有一句话很准：", "e": 4.786}, {"t": 5.156, "s": "我们不挖河，", "e": 7.028}, {"t": 7.398, "s": "只是在它已流过的地方，把它拓宽。", "e": 10.542}, {"t": 11.362, "s": "Flux不是凭空造一条河，", "e": 13.834}, {"t": 14.204, "s": "而是找到业务里已经在流动的部分，", "e": 17.204}, {"t": 17.574, "s": "让AI顺着它，流得更宽、更快。", "e": 20.886}]}, {"n": 18, "title": "定位：三类角色中的 Echo", "start": 532.162, "dur": 33.55, "cues": [{"t": 0.0, "s": "在落地工程的三类角色里，", "e": 2.64}, {"t": 3.01, "s": "我最匹配的是Echo。", "e": 5.17}, {"t": 5.54, "s": "帕兰提尔的第二号工程师鲍勃·麦格鲁说过：", "e": 9.308}, {"t": 9.678, "s": "Echo应该招自你所服务领域的领域专家，", "e": 12.846}, {"t": 13.216, "s": "关键特质是革新者、异类——", "e": 16.024}, {"t": 16.394, "s": "因为一个对现状完全满意的人，", "e": 19.202}, {"t": 19.572, "s": "永远找不出阶跃式的变化。", "e": 22.068}, {"t": 22.888, "s": "对业务本质的理解无法通用化，", "e": 25.912}, {"t": 26.282, "s": "只能按行业沉淀。", "e": 28.394}, {"t": 28.764, "s": "而我沉淀的行业，", "e": 30.876}, {"t": 31.246, "s": "是汽车和用户体验。", "e": 33.43}]}, {"n": 19, "title": "印证：用户体验的内核就是 Echo", "start": 566.162, "dur": 35.072, "cues": [{"t": 0.0, "s": "为什么这么说？", "e": 1.68}, {"t": 2.05, "s": "看我做了二十多年的方法论就明白了。", "e": 5.098}, {"t": 5.468, "s": "设计的五步：察、定、构、验、达；", "e": 9.5}, {"t": 9.87, "s": "Echo的五步：听、判、拆、锚、推。", "e": 13.734}, {"t": 14.104, "s": "两者共享同一个内核——", "e": 16.528}, {"t": 16.898, "s": "都不接受问题被给定的样子。", "e": 19.466}, {"t": 20.286, "s": "Echo的官方定义，是识别真正的问题；", "e": 23.454}, {"t": 23.824, "s": "设计思维的Define阶段，", "e": 26.32}, {"t": 26.69, "s": "做的是同一件事。", "e": 28.706}, {"t": 29.076, "s": "一句话：", "e": 30.564}, {"t": 30.934, "s": "用户体验的本质，", "e": 32.926}, {"t": 33.296, "s": "就是Echo。", "e": 34.952}]}, {"n": 20, "title": "履历：懂车机，是懂一台车的全部约束", "start": 601.684, "dur": 36.838, "cues": [{"t": 0.0, "s": "再看行业履历。", "e": 1.944}, {"t": 2.314, "s": "在比亚迪，", "e": 3.898}, {"t": 4.268, "s": "我负责仰望U8、汉、唐、方程豹、海豚，", "e": 8.66}, {"t": 9.03, "s": "和DiLink五点一、六点零、七点零的体验设计；", "e": 12.87}, {"t": 13.24, "s": "在吉利和极氪，", "e": 15.184}, {"t": 15.554, "s": "做HMI质量管理；", "e": 17.714}, {"t": 18.084, "s": "在拜腾，从UI/UX经理做到部门负责人；", "e": 21.684}, {"t": 22.054, "s": "再往前，是斑马智行的GUI设计负责人，", "e": 25.75}, {"t": 26.12, "s": "做过中国最早一批互联网车机的量产。", "e": 29.48}, {"t": 30.3, "s": "懂车机不是懂界面，", "e": 32.508}, {"t": 32.878, "s": "是懂一台车从概念到量产，有多少道约束。", "e": 36.718}]}, {"n": 21, "title": "实证：三个已经落地的 AI 项目", "start": 638.972, "dur": 45.478, "cues": [{"t": 0.0, "s": "更重要的是，Flux要走的这条路，", "e": 3.144}, {"t": 3.514, "s": "我已经走过一遍。", "e": 5.458}, {"t": 5.828, "s": "第一个项目：把品牌IP训练成可控的生成式资产，", "e": 10.028}, {"t": 10.398, "s": "建立了视觉一致性标准——这是资产化的最小验证。", "e": 14.886}, {"t": 15.256, "s": "第二个项目：搭了一条AINative创意产线，", "e": 18.736}, {"t": 19.106, "s": "多智能体协作，从策划到打包交付——这是工序抽取的预演。", "e": 24.098}, {"t": 24.468, "s": "第三个项目：车机AI壁纸生成，", "e": 27.612}, {"t": 27.982, "s": "从概念、提示词体系到量产，全程负责——", "e": 31.918}, {"t": 32.288, "s": "这是唯一一个真正走完从概念到量产的AI项目。", "e": 36.656}, {"t": 37.476, "s": "三个例子都有明确的谁在用、什么时候用、怎么验收。", "e": 41.988}, {"t": 42.358, "s": "这，也是我对Flux的验收标准。", "e": 45.358}]}, {"n": 22, "title": "视野：全球足迹", "start": 684.9, "dur": 29.556, "cues": [{"t": 0.0, "s": "最后一页关于我。", "e": 2.088}, {"t": 2.458, "s": "德国、中国、美国——", "e": 4.906}, {"t": 5.276, "s": "我在这三个地方，", "e": 7.244}, {"t": 7.614, "s": "都居住过、工作过、生活过。", "e": 10.518}, {"t": 11.338, "s": "服务过横跨三大洲、四十多个国家的一千六百多名专业人才。", "e": 16.306}, {"t": 16.676, "s": "优越的全球视野背景，", "e": 18.884}, {"t": 19.254, "s": "来自三种文化里的真实生活。", "e": 22.182}, {"t": 22.552, "s": "这也是为什么，", "e": 24.352}, {"t": 24.722, "s": "Flux的第一个种子，", "e": 26.714}, {"t": 27.084, "s": "我敢选在海外销售端。", "e": 29.436}]}, {"n": 23, "title": "Q&A", "start": 714.906, "dur": 20.2, "cues": [{"t": 0.0, "s": "以上就是Flux企业AI落地计划，", "e": 3.24}, {"t": 3.61, "s": "和我为什么是做这件事的人。", "e": 6.202}, {"t": 7.022, "s": "从危机，到趋势，到方法，到种子，", "e": 10.646}, {"t": 11.016, "s": "再到人。", "e": 12.408}, {"t": 12.778, "s": "逻辑已经完整，", "e": 14.602}, {"t": 14.972, "s": "接下来，", "e": 16.292}, {"t": 16.662, "s": "听各位的问题。", "e": 18.414}, {"t": 18.784, "s": "谢谢。", "e": 20.08}]}], "cues": [{"t": 0.0, "s": "各位好。", "e": 1.368, "p": 1}, {"t": 2.188, "s": "今天我要讲的，不是又一个AI概念，", "e": 5.644, "p": 1}, {"t": 6.014, "s": "而是一个落地计划——Flux企业AI落地计划。", "e": 9.854, "p": 1}, {"t": 10.224, "s": "Flux，就是渗透的意思。", "e": 12.816, "p": 1}, {"t": 13.186, "s": "这个计划只做一件事：让AI从演示厅里走出来，", "e": 17.578, "p": 1}, {"t": 17.948, "s": "渗进企业的真实业务里。", "e": 20.396, "p": 1}, {"t": 20.966, "s": "先看一组扎心的数据。", "e": 23.222, "p": 2}, {"t": 23.592, "s": "MIT的调研显示：已经有近40%的组织部署了通用大模型工具；", "e": 29.112, "p": 2}, {"t": 29.482, "s": "但真正进入生产阶段的企业级定制AI系统，", "e": 33.466, "p": 2}, {"t": 33.836, "s": "只有5%。", "e": 35.636, "p": 2}, {"t": 36.456, "s": "通用工具人人都在用，", "e": 38.904, "p": 2}, {"t": 39.274, "s": "可一碰到企业自己的业务，", "e": 41.914, "p": 2}, {"t": 42.284, "s": "几乎全军覆没。", "e": 44.3, "p": 2}, {"t": 44.67, "s": "更要命的是，AI的能力按季度翻倍，", "e": 48.174, "p": 2}, {"t": 48.544, "s": "企业的采用曲线却几乎走平。", "e": 51.448, "p": 2}, {"t": 51.818, "s": "这个缺口，不会自己合上。", "e": 54.578, "p": 2}, {"t": 55.148, "s": "那跑通AI的大厂，做对了什么？", "e": 58.196, "p": 3}, {"t": 58.566, "s": "答案出奇一致：它们都设了同一个角色。", "e": 62.118, "p": 3}, {"t": 62.488, "s": "这个角色在大厂AI化组织里已是标配，", "e": 66.184, "p": 3}, {"t": 66.554, "s": "近一年还在持续扩张。", "e": 68.978, "p": 3}, {"t": 69.348, "s": "因为当AI已经能替代大量开发工作时，", "e": 72.684, "p": 3}, {"t": 73.054, "s": "企业缺的不是技术，", "e": 75.07, "p": 3}, {"t": 75.44, "s": "而是一个帮企业完成AI化改造的人。", "e": 78.848, "p": 3}, {"t": 79.668, "s": "竞对在跑、大厂在跑——这已经不是要不要做的问题，", "e": 84.084, "p": 3}, {"t": 84.454, "s": "而是多快做对的问题。", "e": 86.71, "p": 3}, {"t": 87.28, "s": "二零二六年五月四日，", "e": 89.488, "p": 4}, {"t": 89.858, "s": "发生了标志性的一幕：", "e": 92.162, "p": 4}, {"t": 92.532, "s": "OpenAI和Anthropic，", "e": 94.692, "p": 4}, {"t": 95.062, "s": "在同一天，押注了同一件事——帮AI进入企业。", "e": 99.166, "p": 4}, {"t": 99.536, "s": "OpenAI成立DeploymentCompany，募资四十亿、估值一百亿美元；", "e": 103.808, "p": 4}, {"t": 104.178, "s": "Anthropic联合黑石、高盛，做了十五亿美元的企业AI合资公司。", "e": 109.314, "p": 4}, {"t": 109.684, "s": "而支撑这套打法的驻场工程师岗位，", "e": 112.948, "p": 4}, {"t": 113.318, "s": "去年前九个月招聘量暴涨超过800%。", "e": 117.134, "p": 4}, {"t": 117.954, "s": "资本已经投票了：", "e": 119.946, "p": 4}, {"t": 120.316, "s": "AI的下半场，", "e": 122.044, "p": 4}, {"t": 122.414, "s": "拼的是落地。", "e": 124.022, "p": 4}, {"t": 124.592, "s": "那企业自己要怎么落地？", "e": 127.04, "p": 5}, {"t": 127.41, "s": "目前被验证最有效的，是两条腿：", "e": 130.626, "p": 5}, {"t": 130.996, "s": "第一，定制出合用的AI工具——不是采购现成品，", "e": 134.956, "p": 5}, {"t": 135.326, "s": "而是贴着业务定制工作流；", "e": 137.774, "p": 5}, {"t": 138.144, "s": "第二，推行全员使用——不是发账号就完事，", "e": 141.768, "p": 5}, {"t": 142.138, "s": "而是排除障碍、教会全员、用数据度量。", "e": 145.93, "p": 5}, {"t": 146.75, "s": "但这两条腿之间，", "e": 148.862, "p": 5}, {"t": 149.232, "s": "隔着一条沟。", "e": 150.888, "p": 5}, {"t": 151.258, "s": "沟的两岸，是懂业务的人，和AI的能力。", "e": 154.93, "p": 5}, {"t": 155.3, "s": "这中间，需要一座桥。", "e": 157.7, "p": 5}, {"t": 158.27, "s": "这座桥一旦架起来，", "e": 160.43, "p": 6}, {"t": 160.8, "s": "接下来的就不是细水长流，", "e": 163.536, "p": 6}, {"t": 163.906, "s": "而是一场浪潮。", "e": 165.634, "p": 6}, {"t": 166.454, "s": "全球大厂在一年半前已经开始布局AI化。", "e": 170.15, "p": 6}, {"t": 170.52, "s": "这股洪水正在冲向每一家企业。", "e": 173.568, "p": 6}, {"t": 173.938, "s": "问题只剩下一个：", "e": 175.978, "p": 6}, {"t": 176.348, "s": "我们，要怎么准备？", "e": 178.508, "p": 6}, {"t": 179.078, "s": "先看别人已经跑通的样子。", "e": 181.718, "p": 7}, {"t": 182.088, "s": "营销端，三星把单向广告变成AI对话推荐，", "e": 186.456, "p": 7}, {"t": 186.826, "s": "互动成本降了54%，获客成本降了73%，广告回报翻了三倍。", "e": 192.586, "p": 7}, {"t": 192.956, "s": "零售端，Zara用RFID加AI实时调度库存，", "e": 197.276, "p": 7}, {"t": 197.646, "s": "季末库存压到0.6%，", "e": 200.454, "p": 7}, {"t": 200.824, "s": "而行业还在百分之十到二十。", "e": 203.656, "p": 7}, {"t": 204.026, "s": "售后端，Target给店员配了AI助手，", "e": 207.506, "p": 7}, {"t": 207.876, "s": "上线三周，被问了五万多次。", "e": 210.828, "p": 7}, {"t": 211.648, "s": "三个行业，三个模块，", "e": 214.168, "p": 7}, {"t": 214.538, "s": "全是先跑通一个种子案例，", "e": 217.01, "p": 7}, {"t": 217.38, "s": "再复制。", "e": 218.772, "p": 7}, {"t": 219.142, "s": "这，就是浪潮已经上岸的证据。", "e": 222.31, "p": 7}, {"t": 222.88, "s": "看完案例再回头看这张图，", "e": 225.688, "p": 8}, {"t": 226.058, "s": "逻辑就非常清楚了。", "e": 228.218, "p": 8}, {"t": 228.588, "s": "三星、Zara、Target，", "e": 231.084, "p": 8}, {"t": 231.454, "s": "没有一家是靠买工具买出来的，", "e": 234.358, "p": 8}, {"t": 234.728, "s": "全都是定制工具加全员推行，两条腿一起走。", "e": 238.832, "p": 8}, {"t": 239.202, "s": "而连接这两条腿的桥，", "e": 241.482, "p": 8}, {"t": 241.852, "s": "就是一套落地的操作方法。", "e": 244.396, "p": 8}, {"t": 244.766, "s": "这套方法，", "e": 246.326, "p": 8}, {"t": 246.696, "s": "就是我们今天要讲的Flux计划的内核。", "e": 250.104, "p": 8}, {"t": 250.674, "s": "再回头看巨头的动作。", "e": 253.098, "p": 9}, {"t": 253.468, "s": "四十亿美元和十五亿美元，", "e": 256.276, "p": 9}, {"t": 256.646, "s": "买的不是模型，", "e": 258.422, "p": 9}, {"t": 258.792, "s": "而是把AI送进企业的能力。", "e": 261.432, "p": 9}, {"t": 261.802, "s": "OpenAI一次收购就引入约一百五十名落地工程师。", "e": 265.69, "p": 9}, {"t": 266.06, "s": "这说明什么？", "e": 267.74, "p": 9}, {"t": 268.11, "s": "说明这套「驻场、贴业务、交付结果」的打法，", "e": 272.046, "p": 9}, {"t": 272.416, "s": "已经被最顶级的玩家用钱验证过了。", "e": 275.8, "p": 9}, {"t": 276.17, "s": "我们要做的，", "e": 277.946, "p": 9}, {"t": 278.316, "s": "是把它变成自己的计划。", "e": 280.716, "p": 9}, {"t": 281.286, "s": "所以这三张标签，", "e": 283.494, "p": 10}, {"t": 283.864, "s": "现在可以读得更直白：", "e": 286.264, "p": 10}, {"t": 286.634, "s": "已被验证，是大厂组织架构里的标配；", "e": 290.234, "p": 10}, {"t": 290.604, "s": "正在扩张，是招聘数据里的八百个百分点；", "e": 294.276, "p": 10}, {"t": 294.646, "s": "时代共识，是两大巨头同一天的下注。", "e": 298.294, "p": 10}, {"t": 299.114, "s": "桥的价值已经被证明。", "e": 301.562, "p": 10}, {"t": 301.932, "s": "接下来的问题变成了：", "e": 304.188, "p": 10}, {"t": 304.558, "s": "这座桥，我们怎么造？", "e": 306.838, "p": 10}, {"t": 307.408, "s": "答案就是Flux。", "e": 309.28, "p": 11}, {"t": 310.1, "s": "一套定制级的AINative方案。", "e": 312.836, "p": 11}, {"t": 313.206, "s": "目标一句话：", "e": 314.91, "p": 11}, {"t": 315.28, "s": "让AI渗透到业务的基准线。", "e": 317.992, "p": 11}, {"t": 318.362, "s": "不是做几个炫酷的演示，", "e": 320.738, "p": 11}, {"t": 321.108, "s": "而是让AI变成业务每天都离不开的底层能力。", "e": 324.948, "p": 11}, {"t": 325.518, "s": "Flux怎么落地？", "e": 327.342, "p": 12}, {"t": 327.712, "s": "靠三种职能。", "e": 329.584, "p": 12}, {"t": 329.954, "s": "第一，渗透剂：从细分业务切入，", "e": 333.194, "p": 12}, {"t": 333.564, "s": "把方法渗进一线每天的动作里，", "e": 336.444, "p": 12}, {"t": 336.814, "s": "让个人经验蒸馏成组织资产。", "e": 339.862, "p": 12}, {"t": 340.232, "s": "第二，催化剂：用AI啃透一个业务，", "e": 343.736, "p": 12}, {"t": 344.106, "s": "把成功案例凝成模板，", "e": 346.41, "p": 12}, {"t": 346.78, "s": "再逐个复制，", "e": 348.604, "p": 12}, {"t": 348.974, "s": "让交付周期持续缩短。", "e": 351.422, "p": 12}, {"t": 351.792, "s": "第三，离析剂：全员拉齐AI基线，", "e": 355.272, "p": 12}, {"t": 355.642, "s": "用「使用量乘业务产出」双维度看数据，", "e": 358.906, "p": 12}, {"t": 359.276, "s": "最终标定出——谁该上、谁该下。", "e": 362.204, "p": 12}, {"t": 363.024, "s": "渗透、催化、离析，", "e": 365.568, "p": 12}, {"t": 365.938, "s": "三步走完，业务就变成了AINative。", "e": 369.13, "p": 12}, {"t": 369.7, "s": "顺着离析剂再往深看一层：", "e": 372.556, "p": 13}, {"t": 372.926, "s": "AI时代的人才结构会怎么变？", "e": 375.806, "p": 13}, {"t": 376.176, "s": "世界经济论坛的判断是，", "e": 378.696, "p": 13}, {"t": 379.066, "s": "人的价值会集中到四个动作上：", "e": 382.114, "p": 13}, {"t": 382.484, "s": "定义问题、设定约束、评估结果、做最终决策。", "e": 386.876, "p": 13}, {"t": 387.696, "s": "也就是说，", "e": 389.232, "p": 13}, {"t": 389.602, "s": "中段那些重复的、执行性的任务，", "e": 393.034, "p": 13}, {"t": 393.404, "s": "会被AI吃掉；", "e": 395.276, "p": 13}, {"t": 395.646, "s": "人的时间，要往两端搬。", "e": 398.238, "p": 13}, {"t": 398.608, "s": "所以Flux要做的不是筛人，", "e": 401.128, "p": 13}, {"t": 401.498, "s": "而是把同一个人的时间，从中段搬到两端。", "e": 405.29, "p": 13}, {"t": 405.86, "s": "方法有了，第一仗打在哪？", "e": 408.452, "p": 14}, {"t": 408.822, "s": "Flux的第一个种子，", "e": 410.814, "p": 14}, {"t": 411.184, "s": "选在海外销售端。", "e": 413.368, "p": 14}, {"t": 413.738, "s": "三个理由。", "e": 415.202, "p": 14}, {"t": 415.572, "s": "第一，痛点最痛：全球跨语言、跨时区、跨渠道，", "e": 420.108, "p": 14}, {"t": 420.478, "s": "报价、会议、资料同步大量靠人肉搬运。", "e": 424.39, "p": 14}, {"t": 424.76, "s": "第二，价值可验证：销售端最接近用户，", "e": 428.6, "p": 14}, {"t": 428.97, "s": "AI的产出直接换算成订单、转化率、响应时间，", "e": 433.098, "p": 14}, {"t": 433.468, "s": "当天就看得见。", "e": 435.268, "p": 14}, {"t": 435.638, "s": "第三，闭环可复制：现场洞察反哺产品，", "e": 439.43, "p": 14}, {"t": 439.8, "s": "能力沿着营销、渠道、交付、风控、售后流向相邻环节。", "e": 445.176, "p": 14}, {"t": 445.996, "s": "跑通一个点，", "e": 447.604, "p": 14}, {"t": 447.974, "s": "复制一张网。", "e": 449.774, "p": 14}, {"t": 450.344, "s": "总结一下整条线：", "e": 452.36, "p": 15}, {"t": 452.73, "s": "从浮冰，", "e": 454.17, "p": 15}, {"t": 454.54, "s": "到洪水，", "e": 455.956, "p": 15}, {"t": 456.326, "s": "到Flux。", "e": 457.718, "p": 15}, {"t": 458.538, "s": "这个计划最终交付四个改变：", "e": 461.274, "p": 15}, {"t": 461.644, "s": "业务提效——AI介入前后，数据可度量、可归因；", "e": 465.868, "p": 15}, {"t": 466.238, "s": "人才标定——谁能管理AI，谁可以被替代，标签从模糊变精准；", "e": 471.446, "p": 15}, {"t": 471.816, "s": "资产沉淀——经验沉淀为公司资产，人来人走，业务质量不变；", "e": 477.336, "p": 15}, {"t": 477.706, "s": "流程清晰——含糊拖慢的业务流，被重新梳理得高效清晰。", "e": 482.41, "p": 15}, {"t": 482.78, "s": "这，", "e": 484.028, "p": 15}, {"t": 484.398, "s": "就是Flux企业AI落地计划。", "e": 487.182, "p": 15}, {"t": 487.752, "s": "一句话收尾：", "e": 489.552, "p": 16}, {"t": 489.922, "s": "让AI在业务里真正产出价值。", "e": 493.042, "p": 16}, {"t": 493.862, "s": "今天的分享就到这里，", "e": 496.214, "p": 16}, {"t": 496.584, "s": "哪一页希望展开讨论，我们随时可以深聊。", "e": 500.28, "p": 16}, {"t": 500.65, "s": "接下来的时间，", "e": 502.45, "p": 16}, {"t": 502.82, "s": "请允许我用几页，", "e": 504.98, "p": 16}, {"t": 505.35, "s": "介绍一下我自己——", "e": 507.294, "p": 16}, {"t": 507.664, "s": "为什么是我，来做Flux。", "e": 510.136, "p": 16}, {"t": 510.706, "s": "先说我对自己角色的理解。", "e": 513.346, "p": 17}, {"t": 513.716, "s": "有一句话很准：", "e": 515.492, "p": 17}, {"t": 515.862, "s": "我们不挖河，", "e": 517.734, "p": 17}, {"t": 518.104, "s": "只是在它已流过的地方，把它拓宽。", "e": 521.248, "p": 17}, {"t": 522.068, "s": "Flux不是凭空造一条河，", "e": 524.54, "p": 17}, {"t": 524.91, "s": "而是找到业务里已经在流动的部分，", "e": 527.91, "p": 17}, {"t": 528.28, "s": "让AI顺着它，流得更宽、更快。", "e": 531.592, "p": 17}, {"t": 532.162, "s": "在落地工程的三类角色里，", "e": 534.802, "p": 18}, {"t": 535.172, "s": "我最匹配的是Echo。", "e": 537.332, "p": 18}, {"t": 537.702, "s": "帕兰提尔的第二号工程师鲍勃·麦格鲁说过：", "e": 541.47, "p": 18}, {"t": 541.84, "s": "Echo应该招自你所服务领域的领域专家，", "e": 545.008, "p": 18}, {"t": 545.378, "s": "关键特质是革新者、异类——", "e": 548.186, "p": 18}, {"t": 548.556, "s": "因为一个对现状完全满意的人，", "e": 551.364, "p": 18}, {"t": 551.734, "s": "永远找不出阶跃式的变化。", "e": 554.23, "p": 18}, {"t": 555.05, "s": "对业务本质的理解无法通用化，", "e": 558.074, "p": 18}, {"t": 558.444, "s": "只能按行业沉淀。", "e": 560.556, "p": 18}, {"t": 560.926, "s": "而我沉淀的行业，", "e": 563.038, "p": 18}, {"t": 563.408, "s": "是汽车和用户体验。", "e": 565.592, "p": 18}, {"t": 566.162, "s": "为什么这么说？", "e": 567.842, "p": 19}, {"t": 568.212, "s": "看我做了二十多年的方法论就明白了。", "e": 571.26, "p": 19}, {"t": 571.63, "s": "设计的五步：察、定、构、验、达；", "e": 575.662, "p": 19}, {"t": 576.032, "s": "Echo的五步：听、判、拆、锚、推。", "e": 579.896, "p": 19}, {"t": 580.266, "s": "两者共享同一个内核——", "e": 582.69, "p": 19}, {"t": 583.06, "s": "都不接受问题被给定的样子。", "e": 585.628, "p": 19}, {"t": 586.448, "s": "Echo的官方定义，是识别真正的问题；", "e": 589.616, "p": 19}, {"t": 589.986, "s": "设计思维的Define阶段，", "e": 592.482, "p": 19}, {"t": 592.852, "s": "做的是同一件事。", "e": 594.868, "p": 19}, {"t": 595.238, "s": "一句话：", "e": 596.726, "p": 19}, {"t": 597.096, "s": "用户体验的本质，", "e": 599.088, "p": 19}, {"t": 599.458, "s": "就是Echo。", "e": 601.114, "p": 19}, {"t": 601.684, "s": "再看行业履历。", "e": 603.628, "p": 20}, {"t": 603.998, "s": "在比亚迪，", "e": 605.582, "p": 20}, {"t": 605.952, "s": "我负责仰望U8、汉、唐、方程豹、海豚，", "e": 610.344, "p": 20}, {"t": 610.714, "s": "和DiLink五点一、六点零、七点零的体验设计；", "e": 614.554, "p": 20}, {"t": 614.924, "s": "在吉利和极氪，", "e": 616.868, "p": 20}, {"t": 617.238, "s": "做HMI质量管理；", "e": 619.398, "p": 20}, {"t": 619.768, "s": "在拜腾，从UI/UX经理做到部门负责人；", "e": 623.368, "p": 20}, {"t": 623.738, "s": "再往前，是斑马智行的GUI设计负责人，", "e": 627.434, "p": 20}, {"t": 627.804, "s": "做过中国最早一批互联网车机的量产。", "e": 631.164, "p": 20}, {"t": 631.984, "s": "懂车机不是懂界面，", "e": 634.192, "p": 20}, {"t": 634.562, "s": "是懂一台车从概念到量产，有多少道约束。", "e": 638.402, "p": 20}, {"t": 638.972, "s": "更重要的是，Flux要走的这条路，", "e": 642.116, "p": 21}, {"t": 642.486, "s": "我已经走过一遍。", "e": 644.43, "p": 21}, {"t": 644.8, "s": "第一个项目：把品牌IP训练成可控的生成式资产，", "e": 649.0, "p": 21}, {"t": 649.37, "s": "建立了视觉一致性标准——这是资产化的最小验证。", "e": 653.858, "p": 21}, {"t": 654.228, "s": "第二个项目：搭了一条AINative创意产线，", "e": 657.708, "p": 21}, {"t": 658.078, "s": "多智能体协作，从策划到打包交付——这是工序抽取的预演。", "e": 663.07, "p": 21}, {"t": 663.44, "s": "第三个项目：车机AI壁纸生成，", "e": 666.584, "p": 21}, {"t": 666.954, "s": "从概念、提示词体系到量产，全程负责——", "e": 670.89, "p": 21}, {"t": 671.26, "s": "这是唯一一个真正走完从概念到量产的AI项目。", "e": 675.628, "p": 21}, {"t": 676.448, "s": "三个例子都有明确的谁在用、什么时候用、怎么验收。", "e": 680.96, "p": 21}, {"t": 681.33, "s": "这，也是我对Flux的验收标准。", "e": 684.33, "p": 21}, {"t": 684.9, "s": "最后一页关于我。", "e": 686.988, "p": 22}, {"t": 687.358, "s": "德国、中国、美国——", "e": 689.806, "p": 22}, {"t": 690.176, "s": "我在这三个地方，", "e": 692.144, "p": 22}, {"t": 692.514, "s": "都居住过、工作过、生活过。", "e": 695.418, "p": 22}, {"t": 696.238, "s": "服务过横跨三大洲、四十多个国家的一千六百多名专业人才。", "e": 701.206, "p": 22}, {"t": 701.576, "s": "优越的全球视野背景，", "e": 703.784, "p": 22}, {"t": 704.154, "s": "来自三种文化里的真实生活。", "e": 707.082, "p": 22}, {"t": 707.452, "s": "这也是为什么，", "e": 709.252, "p": 22}, {"t": 709.622, "s": "Flux的第一个种子，", "e": 711.614, "p": 22}, {"t": 711.984, "s": "我敢选在海外销售端。", "e": 714.336, "p": 22}, {"t": 714.906, "s": "以上就是Flux企业AI落地计划，", "e": 718.146, "p": 23}, {"t": 718.516, "s": "和我为什么是做这件事的人。", "e": 721.108, "p": 23}, {"t": 721.928, "s": "从危机，到趋势，到方法，到种子，", "e": 725.552, "p": 23}, {"t": 725.922, "s": "再到人。", "e": 727.314, "p": 23}, {"t": 727.684, "s": "逻辑已经完整，", "e": 729.508, "p": 23}, {"t": 729.878, "s": "接下来，", "e": 731.198, "p": 23}, {"t": 731.568, "s": "听各位的问题。", "e": 733.32, "p": 23}, {"t": 733.69, "s": "谢谢。", "e": 734.986, "p": 23}], "total": 735.556}</script>

/* ---------- 构建 ---------- */
const pagesEl = $('#pages');
PAGES.forEach((h,i)=>{ const d=document.createElement('div'); d.innerHTML=h; pagesEl.appendChild(d.firstElementChild); });
const pageEls = [...pagesEl.children];
const menu = $('#menu');
CUEDATA.pages.forEach((p,i)=>{
  const mi=document.createElement('div'); mi.className='mi';
  mi.innerHTML=`<b>P${i+1}</b><span>${p.title}</span>`;
  mi.onclick=()=>{ menu.classList.remove('open'); goTo(i,true); };
  menu.appendChild(mi);
});

const vo = $('#vo'), sub = $('#subtitle'), subTxt = $('#subtitle span');
const ICON_PLAY = '<svg width="9" height="10" viewBox="0 0 9 10"><path d="M0,0 L9,5 L0,10 Z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="9" height="10" viewBox="0 0 9 10"><rect x="0" y="0" width="3" height="10" fill="currentColor"/><rect x="6" y="0" width="3" height="10" fill="currentColor"/></svg>';
function setPlayUI(playing){
  document.querySelector('#btn-play .ic').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  document.querySelector('#btn-play .tx').textContent = playing ? 'Playing' : 'Paused';
}
let cur=-1, subOn=true, shotMode=false;

function setVideo(i,on){
  const v = pageEls[i].querySelector('video');
  if(v){ if(on){ v.currentTime=0; v.play().catch(()=>{}); } else v.pause(); }
}
function show(i){
  if(i===cur) return;
  if(cur>=0){ pageEls[cur].classList.remove('active'); setVideo(cur,false); }
  cur=i;
  pageEls[cur].classList.add('active'); setVideo(cur,true);
  $('#pageind').textContent = `P${i+1} / ${N}`;
  $('#ptitle').textContent = CUEDATA.pages[i].title;
}
function goTo(i,play){
  i=Math.max(0,Math.min(N-1,i));
  if(shotMode){ show(i); return; }
  vo.currentTime = CUEDATA.pages[i].start + 0.01;
  show(i);
  if(play){ vo.play(); }
}
vo.addEventListener('timeupdate',()=>{
  const t=vo.currentTime;
  const ps=CUEDATA.pages;
  let pi=ps.findIndex(p=>t>=p.start && t<p.start+p.dur+0.45);
  if(pi>=0 && pi!==cur) show(pi);
  $('#progress').style.width=(t/CUEDATA.total*100)+'%';
  if(subOn){
    const c=CUEDATA.cues.find(c=>t>=c.t && t<c.e);
    if(c){ subTxt.textContent=c.s; sub.classList.add('on'); }
    else sub.classList.remove('on');
  }
});
vo.addEventListener('play',()=>setPlayUI(true));
vo.addEventListener('pause',()=>setPlayUI(false));

$('#btn-play').onclick=()=>{ if(shotMode) return; vo.paused?vo.play():vo.pause(); };
$('#btn-prev').onclick=()=>goTo(cur-1,!vo.paused);
$('#btn-next').onclick=()=>goTo(cur+1,!vo.paused);
$('#btn-sub').onclick=e=>{ subOn=!subOn; e.currentTarget.classList.toggle('off',!subOn); if(!subOn) sub.classList.remove('on'); };
$('#btn-menu').onclick=()=>menu.classList.toggle('open');
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') goTo(cur-1,!vo.paused);
  else if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); e.key===' '? (vo.paused?vo.play():vo.pause()) : goTo(cur+1,!vo.paused); }
  else if(e.key==='s'||e.key==='S') $('#btn-sub').click();
  else if(e.key==='g'||e.key==='G') menu.classList.toggle('open');
});

const mShot=location.search.match(/shot=P(\d+)/i);
const mHash=location.hash.match(/P(\d+)/i);
if(mShot){ shotMode=true; show(parseInt(mShot[1])-1); }
else if(mHash){ goTo(parseInt(mHash[1])-1,true); }
else { show(0); }
</script>
