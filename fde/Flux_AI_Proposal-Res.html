<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flux AI Proposal · Res</title>
<style>
:root{
  --bg:#F7F9FB; --panel:#FFFFFF; --ink:#061F32; --ink2:#44546A; --mut:#8A96A3;
  --line:#DDE3EA; --bronze:#C99A5B; --bronze2:#E3B87C; --lime:#C6F24E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0B1118;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;color:var(--ink);overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0B1118}
#stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:var(--bg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease;background:var(--bg)}
.page.active{opacity:1;pointer-events:auto}
.page video.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim-b{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none}
.scrim-dark{background:linear-gradient(to top,rgba(4,10,16,.82) 0%,rgba(4,10,16,.45) 55%,transparent 100%)}
.scrim-light{background:linear-gradient(to top,rgba(247,249,251,.94) 0%,rgba(247,249,251,.55) 55%,transparent 100%)}
/* 章节/封面：文字居中压到构图下方，且避开底部字幕 */
.chapter-text{position:absolute;left:0;right:0;bottom:15.5%;text-align:center;padding:0 8%;z-index:3}
.chapter-text .kick{font-size:clamp(13.5px,1.46vw,20px);letter-spacing:.42em;color:var(--bronze2);text-transform:uppercase;margin-bottom:1.1em;font-weight:600}
.chapter-text h1{font-size:clamp(28.5px,3.71vw,56.5px);font-weight:700;letter-spacing:.06em;line-height:1.25}
.chapter-text .sub{margin-top:1em;font-size:clamp(15px,1.55vw,22.5px);letter-spacing:.12em;opacity:.85}
.on-dark{color:#F4F7FA}.on-dark .sub{color:#C7D2DC}
.on-light{color:var(--ink)}.on-light .sub{color:var(--ink2)}
.on-light .kick{color:var(--bronze)}
/* 内容页通用 */
.content{position:absolute;inset:0;padding:4.2% 5.2% 9.5%;display:flex;flex-direction:column}
.p-head{display:flex;align-items:baseline;gap:1.2em;border-bottom:1px solid var(--line);padding-bottom:1.6%;margin-bottom:2.2%}
/* v18：恢复页头，仅去掉左上角页码章 */
.p-num{display:none!important}
.p-num{font-size:clamp(14.5px,1.33vw,18.5px);letter-spacing:.3em;color:var(--bronze);font-weight:700;white-space:nowrap}
.p-title{font-size:clamp(21px,2.34vw,35px);font-weight:700;letter-spacing:.02em}
.p-sub{font-size:clamp(14.5px,1.4vw,20px);color:var(--mut);margin-left:auto;text-align:right;max-width:40%}
.src{position:absolute;bottom:4.6%;left:5.2%;right:5.2%;font-size:clamp(11.5px,1.09vw,16px);color:var(--mut);letter-spacing:.02em}
.cards{display:flex;gap:2%;flex:1;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:3% 2.6%;flex:1;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(6,31,50,.05)}
.card .tag{font-size:clamp(12.5px,1.19vw,17px);letter-spacing:.28em;color:var(--bronze);font-weight:700;margin-bottom:.9em}
.card h3{font-size:clamp(18px,1.8vw,26.5px);font-weight:700;margin-bottom:.6em}
.card p{font-size:clamp(13.5px,1.33vw,20px);line-height:1.75;color:var(--ink2)}
.card .en{font-size:clamp(11.5px,1.09vw,16px);letter-spacing:.22em;color:var(--mut);margin-bottom:.4em}
.bignum{font-size:clamp(42.5px,5.72vw,89px);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.bignum.bronze{color:var(--bronze)}
.foot-note{margin-top:auto;padding-top:2%;border-top:1px dashed var(--line);font-size:clamp(13.5px,1.33vw,20px);color:var(--ink2);line-height:1.7}
.hl{color:var(--bronze);font-weight:700}
/* ===== 黑底 · 白字 · 绿高亮（P7-P9） ===== */
.sec-g{background:#05090D;color:#F2F6F3}
.sec-g .p-head{border-color:#1B2822}
.sec-g .p-num{color:#9BD65B}
.sec-g .p-title{color:#F2F6F3}
.sec-g .p-sub{color:#7E938A}
.sec-g .card{background:#0B1210;border-color:#1F2E26;box-shadow:none}
.sec-g .card .tag{color:#9BD65B}
.sec-g .card h3{color:#F2F6F3}
.sec-g .card p{color:#A9BCB2}
.sec-g .card .en{color:#64796E}
.sec-g .card p b{color:#E4F2D8}
.sec-g .foot-note{border-color:#1F2E26;color:#A9BCB2}
.sec-g .foot-note b{color:#E4F2D8}
.sec-g .hl{color:#C6F24E}
.sec-g .src{color:#54675D}
.sec-g .case-logo{background:#101815;border:1px solid #1F2E26}
.sec-g .case-metrics{border-color:#1F2E26}
.sec-g .case-metrics b{color:#C6F24E}
.sec-g .case-metrics span{color:#64796E}
.sec-g .ai-before{background:#15201A;color:#7E938A}
.sec-g .ai-after{background:rgba(198,242,78,.13);color:#C6F24E}
/* ===== 黑底 · 白字 · 橙高亮（P11-P14） ===== */
.sec-o{background:#0A0908;color:#FAF6F0}
.sec-o .p-head{border-color:#2A2115}
.sec-o .p-num{color:#F08C2E}
.sec-o .p-title{color:#FAF6F0}
.sec-o .p-sub{color:#A08F7A}
.sec-o .card{background:#120F0B;border-color:#2C2214;box-shadow:none}
.sec-o .card .tag{color:#F08C2E}
.sec-o .card h3{color:#FAF6F0}
.sec-o .card p{color:#B9AA97}
.sec-o .card p b{color:#F0DFC8}
.sec-o .card .en{color:#7A6A54}
.sec-o .foot-note{border-color:#2C2214;color:#B9AA97}
.sec-o .foot-note b{color:#F0DFC8}
.sec-o .hl{color:#F5A95C}
.sec-o .src{color:#6B5C47}
.sec-o .flow3 .fnode{background:#120F0B;border-color:#2C2214;color:#FAF6F0}
.sec-o .flow3 .fnode.hot{border-color:#F08C2E;color:#F5A95C}
.sec-o .flow3 .arr{color:#7A6A54}
/* ===== 深灰底 · 白字 · 古铜金高亮（P17-P22） ===== */
.sec-b{background:#1D232B;color:#F4F7FA}
.sec-b .p-head{border-color:#38424E}
.sec-b .p-num{color:#E3B87C}
.sec-b .p-title{color:#F4F7FA}
.sec-b .p-sub{color:#8B99A8}
.sec-b .card{background:#262E38;border-color:#3B4654;box-shadow:none}
.sec-b .card .tag{color:#E3B87C}
.sec-b .card h3{color:#F4F7FA}
.sec-b .card p{color:#AAB7C4}
.sec-b .card p b{color:#E8EEF4}
.sec-b .card .en{color:#6E7C8C}
.sec-b .foot-note{border-color:#3B4654;color:#AAB7C4}
.sec-b .foot-note b{color:#E8EEF4}
.sec-b .hl{color:#E3B87C}
.sec-b .src{color:#5E6B7A}
.sec-b .longquote{background:#262E38;border-color:#3B4654}
.sec-b .longquote .who{color:#E3B87C}
.sec-b .longquote p{color:#AAB7C4}
.sec-b .longquote p b{color:#E8EEF4}
.sec-b .chain .cnode{background:#262E38;border-color:#3B4654}
.sec-b .chain .cnode b{color:#F4F7FA}
.sec-b .chain .cnode span{color:#8B99A8}
.sec-b .chain .carr{color:#E3B87C}
.sec-b .chain .crow-title{color:#C7D2DC}
.sec-b .bignum{color:#F4F7FA}
.sec-b .bignum.bronze{color:#E3B87C}
/* P2 */
.p2-grid{display:flex;gap:3%;flex:1;min-height:0}
.p2-left{display:flex;flex-direction:column;gap:3%;width:44%}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:5% 6%;flex:1;display:flex;flex-direction:column;justify-content:center}
.stat-card .lab{font-size:clamp(13.5px,1.33vw,20px);color:var(--ink2);margin-top:.8em;line-height:1.5}
.p2-chart{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:3.5%;display:flex;flex-direction:column}
.p2-chart .cap{font-size:clamp(13.5px,1.33vw,18.5px);color:var(--ink2);margin-bottom:2%}
.bridge-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
/* P7 案例 */
.case-card{display:flex;flex-direction:column}
.case-logo{height:17%;min-height:56px;display:flex;align-items:center;justify-content:center;background:#0B1118;border-radius:.8vh;margin-bottom:4%;overflow:hidden}
.case-logo img{width:100%;height:100%;object-fit:cover}
.case-logo img.contain{object-fit:contain;max-height:82%;max-width:80%}
.case-metrics{display:flex;gap:4%;margin-top:auto;padding-top:3%;border-top:1px solid var(--line)}
.case-metrics div{flex:1;text-align:center}
.case-metrics b{display:block;font-size:clamp(17.5px,1.99vw,30.5px);color:var(--bronze);font-weight:800}
.case-metrics span{font-size:clamp(11.5px,1.16vw,16px);color:var(--mut)}
.ai-tag{display:inline-block;font-size:clamp(11.5px,1.09vw,16px);letter-spacing:.2em;padding:.2em .8em;border-radius:2em;margin-bottom:.5em}
.ai-before{background:#F2F4F7;color:var(--mut)}
.ai-after{background:rgba(201,154,91,.15);color:var(--bronze);font-weight:700}
/* P12 人才结构（按 PPT 横向流式） */
.org-flow{flex:1;display:flex;align-items:stretch;gap:1.5%;min-height:0}
.org-col{flex:1.15;display:flex;flex-direction:column;gap:1.4vh}
.org-col.mid{flex:1.5}
.org-pill{text-align:center;font-size:clamp(13.5px,1.33vw,20px);font-weight:700;letter-spacing:.18em;color:#F5A95C;border:1px solid #2C2214;background:#120F0B;border-radius:2em;padding:2.2% 0}
.org-box{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;background:#120F0B;border:1px solid #2C2214;border-radius:1.2vh;font-size:clamp(17px,1.92vw,29px);font-weight:700;color:#FAF6F0;letter-spacing:.06em;padding:4% 6%}
.org-box.keep{border-color:#F08C2E;color:#F5A95C}
.org-arrow{flex:.5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh}
.org-arrow .ln{width:100%;border-top:2px solid #4A3A22;position:relative}
.org-arrow .ln::after{content:"";position:absolute;right:-1px;top:-6px;border:5px solid transparent;border-left:8px solid #4A3A22}
.org-arrow .zh{width:clamp(26px,2.6vw,40px);height:clamp(26px,2.6vw,40px);border-radius:50%;border:1.5px solid #F08C2E;color:#F5A95C;display:flex;align-items:center;justify-content:center;font-size:clamp(13.5px,1.33vw,20px);font-weight:700;background:#0A0908}
/* P15 流程 */
.flow3{display:flex;align-items:center;gap:1.5%;margin-bottom:3%}
.flow3 .fnode{flex:1;text-align:center;padding:1.6% 0;border:1px solid var(--line);border-radius:1vh;background:var(--panel);font-size:clamp(15.5px,1.68vw,25px);font-weight:700;letter-spacing:.15em}
.flow3 .fnode.hot{border-color:var(--bronze);color:var(--bronze)}
.flow3 .arr{color:var(--mut);font-size:clamp(17px,1.92vw,29px)}
/* P19 双链 */
.chain{display:flex;align-items:center;gap:1.2%;margin:2.2% 0}
.chain .cnode{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:1vh;padding:2.2% 1%}
.chain .cnode b{display:block;font-size:clamp(17px,1.8vw,27.5px);margin-bottom:.3em}
.chain .cnode span{font-size:clamp(11px,1.12vw,17px);color:var(--mut);line-height:1.5;display:block}
.chain .carr{color:var(--bronze);font-size:clamp(15px,1.61vw,25px)}
.chain .crow-title{width:7%;font-size:clamp(13.5px,1.33vw,20px);font-weight:700;color:var(--ink2);letter-spacing:.1em}
/* P20 履历 */
.career{position:absolute;top:0;bottom:calc(4.84% + 4px);right:0;width:46%;padding:4.2% 4% 0 3%;display:flex;flex-direction:column;z-index:3}
.career .inner{background:rgba(29,35,43,.82);backdrop-filter:blur(10px);border:1px solid rgba(227,184,124,.3);border-radius:1.4vh;padding:3.6% 5%;flex:1;display:flex;flex-direction:column;overflow:hidden}
.career h2{color:#F4F7FA;font-size:clamp(18px,1.92vw,29px);margin-bottom:.4em}
.career .cap{color:var(--bronze2);font-size:clamp(12.5px,1.26vw,18px);letter-spacing:.1em;margin-bottom:1em}
.job{border-left:2px solid rgba(227,184,124,.4);padding:0 0 0 4%;margin-bottom:3%}
.job b{display:block;color:#F4F7FA;font-size:clamp(14px,1.46vw,21.5px)}
.job i{display:block;color:var(--bronze2);font-style:normal;font-size:clamp(11px,1.12vw,17px);margin:.3em 0}
.job span{color:#AEB9C6;font-size:clamp(11px,1.19vw,17.5px);line-height:1.6}
/* P21 项目（无图重排） */
.proj-num{font-size:clamp(37px,4.36vw,67.5px);font-weight:800;color:rgba(227,184,124,.28);line-height:1;margin-bottom:.2em}
/* P22 地图 */
.mapbg{position:absolute;inset:0;background:#050B12}
.mapbg img{width:100%;height:100%;object-fit:cover;opacity:.9;filter:brightness(.5) contrast(1.05)}
.map-chips{position:absolute;left:0;right:0;bottom:16%;display:flex;justify-content:center;gap:2%;z-index:3;padding:0 6%}
.map-chip{background:rgba(29,35,43,.85);border:1px solid rgba(227,184,124,.35);backdrop-filter:blur(8px);border-radius:1.2vh;padding:2.2% 3%;flex:1;text-align:center}
.map-chip b{display:block;color:var(--bronze2);font-size:clamp(15.5px,1.68vw,25px);margin-bottom:.4em;letter-spacing:.1em}
.map-chip span{color:#C7D2DC;font-size:clamp(12.5px,1.26vw,18px);line-height:1.6}
.map-head{position:absolute;top:7%;left:0;right:0;text-align:center;z-index:3}
.map-head h2{color:#F4F7FA;font-size:clamp(22.5px,2.71vw,40.5px);letter-spacing:.05em}
.map-head p{color:#AEB9C6;font-size:clamp(13.5px,1.4vw,20px);margin-top:.8em;letter-spacing:.08em}
/* P17 引言 */
.quote-page{position:absolute;inset:0;background:#0B1118}
.quote-page img.qbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.quote-block{position:absolute;right:6%;bottom:16%;text-align:right;z-index:3;max-width:52%}
.quote-block .en{color:var(--bronze2);font-size:clamp(14px,1.46vw,21.5px);letter-spacing:.14em;margin-bottom:1em;font-style:italic}
.quote-block .cn{color:#F4F7FA;font-size:clamp(20.5px,2.49vw,38.5px);font-weight:700;line-height:1.5;letter-spacing:.04em}
.quote-block .role{position:absolute;right:0;top:-5.5em;color:rgba(244,247,250,.4);font-size:clamp(13.5px,1.33vw,18.5px);letter-spacing:.4em}
/* P18 长引言 */
.longquote{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:3.5% 4.5%}
.longquote .who{font-size:clamp(14px,1.4vw,20.5px);color:var(--bronze);font-weight:700;margin-bottom:1.2em;letter-spacing:.05em}
.longquote p{font-size:clamp(15px,1.67vw,25px);line-height:2;color:var(--ink2)}
/* Q&A */
.qa{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1D232B 0%,#161C23 100%)}
.qa .big{font-size:clamp(63.5px,9.54vw,159px);font-weight:800;letter-spacing:.04em;color:#F4F7FA;line-height:1}
.qa .line{width:8%;height:3px;background:var(--bronze2);margin:3% 0}
.qa .en{font-size:clamp(15.5px,1.8vw,27.5px);letter-spacing:.34em;color:#E3B87C;text-transform:uppercase}
.qa .cn{margin-top:1.4em;font-size:clamp(14px,1.46vw,21.5px);color:#8B99A8;letter-spacing:.2em}
/* 底部控制条 */
#hud{position:absolute;left:0;right:0;bottom:0;height:4.84%;min-height:38px;background:rgba(8,14,21,.88);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 1.2%;gap:1%;z-index:20;color:#C7D2DC;font-size:clamp(13.5px,1.25vw,18px)}
#hud button{background:none;border:1px solid rgba(199,210,220,.3);color:#C7D2DC;border-radius:.6vh;padding:.3em 1em;font-size:inherit;cursor:pointer;letter-spacing:.08em;display:inline-flex;align-items:center;gap:.5em}
#hud button:hover{border-color:var(--bronze2);color:var(--bronze2)}
#subtitle{position:absolute;left:8%;right:8%;bottom:7%;text-align:center;z-index:15;pointer-events:none}
#subtitle span{display:inline-block;background:rgba(8,14,21,.45);color:#F4F7FA;padding:.5em 1.2em;border-radius:2em;font-size:clamp(15px,1.61vw,25px);letter-spacing:.04em;line-height:1.5;opacity:0;transition:opacity .12s}
#subtitle.on span{opacity:1}
#progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--bronze),var(--bronze2));width:0%;z-index:21;transition:width .3s linear}
#pageind{margin-left:auto;letter-spacing:.15em;color:var(--mut)}
#ptitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44%;color:#8A96A3}
#menu{position:absolute;top:0;right:0;bottom:0;width:26%;background:rgba(8,14,21,.96);z-index:30;transform:translateX(102%);transition:transform .35s ease;overflow-y:auto;padding:3% 3.5%}
#menu.open{transform:translateX(0)}
#menu h4{color:var(--bronze2);letter-spacing:.3em;font-size:17px;margin-bottom:1.2em}
#menu .mi{color:#C7D2DC;padding:.7em .4em;border-bottom:1px solid rgba(199,210,220,.12);cursor:pointer;font-size:clamp(14px,1.33vw,18px);display:flex;gap:.8em}
#menu .mi:hover{color:var(--bronze2)}
#menu .mi b{color:var(--mut);font-weight:400;min-width:2.2em}

/* ===== 竖屏自适应 ===== */
@media (max-aspect-ratio: 3/4){
  #stage{width:100vw;height:100vh;height:100dvh;box-shadow:none}
  .content{padding:5% 5% 15%;overflow-y:auto;display:flex;flex-direction:column}
  .content>*{flex:none}
  .p-head{flex-wrap:wrap}
  .p-sub{display:none}
  .p-title{font-size:23.5px}
  .cards{flex-direction:column!important;gap:14px}
  .card{padding:5% 4.5%}
  .p2-grid{flex-direction:column;gap:14px}
  .p2-left{width:100%;flex-direction:row;gap:3%}
  .p2-chart{min-height:250px}
  .bridge-wrap{min-height:330px}
  .bridge-h{display:none!important}
  .bridge-v{display:block!important;margin:0 auto}
  .flow3 .fnode{font-size:18px;padding:3% 0}
  .org-flow{flex-direction:column;gap:10px}
  .org-col{gap:8px}
  .org-box{min-height:58px;padding:12px 6%;font-size:20.5px}
  .org-arrow{flex-direction:row;padding:0}
  .org-arrow .ln{display:none}
  .org-arrow::after{content:"↓";color:#4A3A22;font-size:20.5px}
  .chain{flex-direction:column;align-items:stretch;gap:8px;margin:2% 0}
  .chain .carr{display:none}
  .chain .crow-title{width:auto;letter-spacing:.2em}
  .chain .cnode{padding:3.5% 3%}
  .case-logo{height:76px}
  .case-metrics{margin-top:14px;padding-top:10px}
  .sec-o .card svg{height:170px}
  .career{width:100%;left:0;right:0;bottom:calc(100px + 4px);padding:5% 5% 0}
  .career .inner{overflow-y:auto}
  .map-chips{flex-direction:column;gap:8px;bottom:11%;max-height:56%;overflow-y:auto;padding:0 5%}
  .map-chip{padding:3.5% 4%}
  .map-head{top:5%}
  .quote-block{left:6%;right:6%;max-width:none;bottom:14%}
  .quote-block .role{position:static;display:block;margin-bottom:1em}
  .chapter-text{bottom:12%;padding:0 6%}
  .longquote{overflow-y:auto}
  .foot-note{margin-top:14px}
  .src{position:static;margin-top:12px}
  .proj-num{font-size:38.5px}
  #subtitle{bottom:9%;left:4%;right:4%}

,{"t": 2.532,"s": "三星、Zara、Target，","e": 4.2},{"t": 4.46,"s": "没有一家是买工具买出来的，","e": 6.003},{"t": 6.263,"s": "都是定制加推行，两条腿一起走。","e": 8.597},{"t": 8.857,"s": "而连接两条腿的那座桥，","e": 10.374},{"t": 10.634,"s": "就是一套可复制的落地方法。","e": 12.378},{"t": 12.638,"s": "这套方法，","e": 13.324},{"t": 13.584,"s": "就是Flux的内核。","e": 14.962}]},{"n": 9,"title": "回扣：巨头的钱流向同一个方向","start": 165.228,"dur": 37.452,"cues": [{"t": 0.0,"s": "再回头看那两笔钱。","e": 1.359},{"t": 1.619,"s": "四十亿，十五亿——","e": 2.812},{"t": 3.072,"s": "买的不是模型，","e": 3.998},{"t": 4.258,"s": "是把AI送进企业的能力。","e": 5.901},{"t": 6.161,"s": "一次收购，就带进来一百五十名落地工程师。","e": 9.075},{"t": 9.905,"s": "这说明什么？","e": 10.632},{"t": 10.892,"s": "说明「驻场、贴业务、交结果」这套打法，","e": 13.55},{"t": 13.81,"s": "已经被最顶级的玩家，","e": 15.151},{"t": 15.411,"s": "用真金白银验证过了。","e": 16.88},{"t": 17.14,"s": "我们要做的，","e": 17.829},{"t": 18.089,"s": "是把它变成自己的。","e": 19.391},{"t": 19.971,"s": "所以那三张标签，","e": 21.29},{"t": 21.55,"s": "现在可以读得更直白：","e": 23.016},{"t": 23.276,"s": "已被验证——是大厂组织架构里的标配；","e": 25.899},{"t": 26.159,"s": "正在扩张——是招聘数据里的八百个百分点；","e": 28.846},{"t": 29.106,"s": "时代共识——是两大巨头同一天的下注。","e": 31.686},{"t": 32.516,"s": "桥的价值，已经被证明。","e": 34.099},{"t": 34.359,"s": "接下来的问题，只剩一个：","e": 35.963},{"t": 36.223,"s": "这座桥，怎么造？","e": 37.322}]},{"n": 11,"title": "章节：Flux 定制级 AI Native 方案","start": 203.63,"dur": 19.323,"cues": [{"t": 0.0,"s": "答案就是Flux。","e": 1.222},{"t": 2.052,"s": "一套定制级的AINative方案。","e": 4.12},{"t": 4.38,"s": "Flux，","e": 4.865},{"t": 5.125,"s": "就是这份定制计划的名字——","e": 6.799},{"t": 7.059,"s": "为比亚迪海外销售，","e": 8.309},{"t": 8.569,"s": "把AI真正做进业务里去。","e": 10.409},{"t": 11.239,"s": "目标一句话：","e": 12.027},{"t": 12.287,"s": "让AI渗到业务的基准线。","e": 14.062},{"t": 14.322,"s": "不是做几个炫酷的演示，","e": 15.793},{"t": 16.053,"s": "而是让AI变成业务每天都离不开的底层能力。","e": 19.193}]},{"n": 12,"title": "方法：Flux 的三种职能","start": 223.653,"dur": 29.845,"cues": [{"t": 0.0,"s": "Flux怎么落地？","e": 1.075},{"t": 1.335,"s": "靠三种职能。","e": 2.308},{"t": 2.568,"s": "渗透剂——从细分业务切进去，","e": 4.665},{"t": 4.925,"s": "把方法渗进一线每天的动作，","e": 6.813},{"t": 7.073,"s": "让个人经验蒸馏成组织资产。","e": 9.092},{"t": 9.352,"s": "催化剂——用AI啃透一个业务，","e": 11.619},{"t": 11.879,"s": "把成功案例凝成模板，","e": 13.304},{"t": 13.564,"s": "再一个个复制出去，","e": 14.854},{"t": 15.114,"s": "让交付周期持续缩短。","e": 16.769},{"t": 17.029,"s": "离析剂——全员拉齐AI基线，","e": 19.202},{"t": 19.462,"s": "用「使用量×业务产出」两个维度看数据，","e": 21.985},{"t": 22.245,"s": "最终标定出：谁该上，谁该下。","e": 24.452},{"t": 25.282,"s": "渗透、催化、离析，","e": 26.856},{"t": 27.116,"s": "三步走完，","e": 27.882},{"t": 28.142,"s": "业务就变成AINative。","e": 29.715}]},{"n": 13,"title": "前瞻：AI 时代的人才结构","start": 254.198,"dur": 20.542,"cues": [{"t": 0.0,"s": "再往深看一层。","e": 1.079},{"t": 1.339,"s": "AI时代，人的价值往哪走？","e": 3.188},{"t": 3.448,"s": "世界经济论坛的判断，是四个动作：","e": 5.638},{"t": 5.898,"s": "定义问题、设定约束、评估结果、做最终决策。","e": 9.232},{"t": 10.062,"s": "中间那些重复的、执行性的活，","e": 12.094},{"t": 12.354,"s": "会被AI吃掉。","e": 13.422},{"t": 13.682,"s": "人的时间，要往两端搬。","e": 15.293},{"t": 15.553,"s": "所以Flux要做的不是筛人，","e": 17.483},{"t": 17.743,"s": "是把同一个人的时间，从中段搬到两端。","e": 20.412}]},{"n": 14,"title": "种子：第一个战场，海外销售端","start": 275.44,"dur": 28.798,"cues": [{"t": 0.0,"s": "方法有了，第一仗打在哪？","e": 1.575},{"t": 1.835,"s": "海外销售端。","e": 2.704},{"t": 2.964,"s": "三个理由。","e": 3.633},{"t": 3.893,"s": "一，痛点最痛——跨语言、跨时区、跨渠道，","e": 7.281},{"t": 7.541,"s": "报价、会议、资料同步，全靠人肉搬运。","e": 10.343},{"t": 10.603,"s": "二，价值可验证——销售端离用户最近，","e": 13.142},{"t": 13.402,"s": "AI的产出直接换成订单、转化率、响应时间，","e": 16.777},{"t": 17.037,"s": "当天就看得见。","e": 18.009},{"t": 18.269,"s": "三，闭环可复制——现场洞察反哺产品，","e": 21.074},{"t": 21.334,"s": "能力沿着营销、渠道、交付、风控、售后，","e": 24.594},{"t": 24.854,"s": "流向相邻环节。","e": 25.956},{"t": 26.786,"s": "跑通一个点，","e": 27.592},{"t": 27.852,"s": "复制一张网。","e": 28.668}]},{"n": 15,"title": "总结：Floe → Flood → Flux","start": 304.938,"dur": 30.145,"cues": [{"t": 0.0,"s": "把整条线收一下：","e": 1.137},{"t": 1.397,"s": "从浮冰，","e": 2.057},{"t": 2.317,"s": "到洪水，","e": 2.982},{"t": 3.242,"s": "到Flux。","e": 3.927},{"t": 4.757,"s": "它最终交付四个改变：","e": 6.272},{"t": 6.532,"s": "业务提效——AI介入前后，数据可度量、可归因；","e": 9.921},{"t": 10.181,"s": "人才标定——谁能管理AI，谁会被替代，标签从模糊变精准；","e": 14.791},{"t": 15.051,"s": "资产沉淀——经验沉淀为公司资产，人来人走，业务质量不变；","e": 19.554},{"t": 19.814,"s": "流程清晰——含糊拖慢的流程，被重新梳理得高效、清楚。","e": 23.81},{"t": 24.07,"s": "这，","e": 24.435},{"t": 24.695,"s": "就是Flux渗透式AI落地计划——","e": 27.253},{"t": 27.513,"s": "我们为迎接AI世代，","e": 28.937},{"t": 29.197,"s": "交出的准备。","e": 30.015}]},{"n": 16,"title": "结尾：让 AI 在业务里真正产出价值","start": 335.783,"dur": 12.997,"cues": [{"t": 0.0,"s": "一句话收尾：","e": 0.797},{"t": 1.057,"s": "迎接AI世代，最好的准备，","e": 2.896},{"t": 3.156,"s": "就是让AI在业务里真正产出价值。","e": 5.566},{"t": 6.396,"s": "方案讲到这里。","e": 7.312},{"t": 7.572,"s": "接下来的时间，","e": 8.431},{"t": 8.691,"s": "请允许我用几页，","e": 9.724},{"t": 9.984,"s": "回答另一个问题——","e": 11.043},{"t": 11.303,"s": "为什么是我，来做Flux。","e": 12.867}]},{"n": 17,"title": "章节：The Role","start": 349.48,"dur": 14.092,"cues": [{"t": 0.0,"s": "先说我怎么理解自己的角色。","e": 1.724},{"t": 1.984,"s": "有一句话很准：","e": 2.907},{"t": 3.167,"s": "我们不挖河，","e": 3.991},{"t": 4.251,"s": "只是在它已流过的地方，把它拓宽。","e": 6.344},{"t": 7.174,"s": "Flux不是凭空造一条河，","e": 8.741},{"t": 9.001,"s": "而是找到业务里已经在流动的部分，","e": 11.037},{"t": 11.297,"s": "让AI顺着它，","e": 12.468},{"t": 12.728,"s": "流得更宽、更快。","e": 13.962}]},{"n": 18,"title": "三角岗职图：Dev · Delta · Echo","start": 364.272,"dur": 5.497,"cues": [{"t": 0.0,"s": "三大岗职，Dev、Delta、Echo——","e": 2.566},{"t": 2.826,"s": "我最匹配的，","e": 3.631},{"t": 3.891,"s": "就是其中的Echo。","e": 5.177}]},{"n": 18,"title": "定位：三类角色中的 Echo","start": 370.219,"dur": 19.315,"cues": [{"t": 6.007,"s": "帕兰提尔的第二号工程师鲍勃·麦格鲁说过：","e": 8.855},{"t": 9.115,"s": "Echo应该来自你所服务领域的领域专家，","e": 11.682},{"t": 11.942,"s": "关键特质是革新者、是异类——","e": 14.114},{"t": 14.374,"s": "因为对现状完全满意的人，","e": 15.952},{"t": 16.212,"s": "永远找不出阶跃式的变化。","e": 17.818},{"t": 18.648,"s": "对业务本质的理解，无法通用化，","e": 20.651},{"t": 20.911,"s": "只能按行业沉淀。","e": 22.083},{"t": 22.343,"s": "而我沉淀的行业，","e": 23.406},{"t": 23.666,"s": "是汽车，是用户体验。","e": 25.132}]},{"n": 19,"title": "印证：用户体验的内核就是 Echo","start": 390.234,"dur": 24.092,"cues": [{"t": 0.0,"s": "为什么敢这么说？","e": 0.919},{"t": 1.179,"s": "看我做了二十多年的方法论就明白了。","e": 3.363},{"t": 3.623,"s": "设计的五步：察、定、构、验、达；","e": 6.667},{"t": 6.927,"s": "Echo的五步：听、判、拆、锚、推。","e": 9.993},{"t": 10.253,"s": "两条链子，同一个内核——","e": 11.896},{"t": 12.156,"s": "都不接受问题被给定的样子。","e": 13.851},{"t": 14.681,"s": "Echo的官方定义，是识别真正的问题；","e": 17.266},{"t": 17.526,"s": "设计思维里的Define，","e": 18.992},{"t": 19.252,"s": "做的是同一件事。","e": 20.393},{"t": 20.653,"s": "所以一句话：","e": 21.433},{"t": 21.693,"s": "用户体验的本质，","e": 22.746},{"t": 23.006,"s": "就是Echo。","e": 23.962}]},{"n": 20,"title": "履历：懂车机，是懂一台车的全部约束","start": 415.026,"dur": 27.046,"cues": [{"t": 0.0,"s": "再看行业履历。","e": 0.986},{"t": 1.246,"s": "在比亚迪，","e": 1.968},{"t": 2.228,"s": "我负责仰望U8、汉、唐、方程豹、海豚，","e": 5.727},{"t": 5.987,"s": "以及DiLink五点一、六点零、七点零的体验设计；","e": 9.336},{"t": 9.596,"s": "在吉利和极氪，","e": 10.578},{"t": 10.838,"s": "做HMI质量管理；","e": 12.307},{"t": 12.567,"s": "在拜腾，从UI/UX经理做到部门负责人；","e": 15.757},{"t": 16.017,"s": "再往前，是斑马智行的GUI设计负责人，","e": 18.804},{"t": 19.064,"s": "做过中国最早一批互联网车机的量产。","e": 21.487},{"t": 22.317,"s": "懂车机，不是懂界面，","e": 23.676},{"t": 23.936,"s": "是懂一台车从概念到量产，有多少道约束。","e": 26.916}]},{"n": 21,"title": "实证：三个已经落地的 AI 项目","start": 442.772,"dur": 33.027,"cues": [{"t": 0.0,"s": "更重要的是，","e": 0.767},{"t": 1.027,"s": "这条路我已经走过一遍。","e": 2.421},{"t": 2.681,"s": "第一个项目：把品牌IP训练成可控的生成式资产，","e": 5.989},{"t": 6.249,"s": "建立视觉一致性标准——这是资产化的最小验证。","e": 9.492},{"t": 9.752,"s": "第二个项目：搭了一条AINative创意产线，","e": 12.459},{"t": 12.719,"s": "多智能体协作，从策划到打包交付——这是工序抽取的预演。","e": 16.7},{"t": 16.96,"s": "第三个项目：车机AI壁纸生成，","e": 19.153},{"t": 19.413,"s": "从概念、提示词体系到量产，全程负责——","e": 22.505},{"t": 22.765,"s": "这是唯一真正走完从概念到量产的AI项目。","e": 25.904},{"t": 26.734,"s": "三个项目都有明确的三件事：","e": 28.45},{"t": 28.71,"s": "谁在用、什么时候用、怎么验收。","e": 30.822},{"t": 31.082,"s": "这也是我对Flux的验收标准。","e": 32.897}]},{"n": 22,"title": "视野：全球足迹","start": 476.499,"dur": 24.333,"cues": [{"t": 0.0,"s": "最后一页，关于我。","e": 1.215},{"t": 1.475,"s": "欧洲、亚洲、美洲——","e": 2.932},{"t": 3.192,"s": "我在三个地方，","e": 4.024},{"t": 4.284,"s": "都居住过、工作过、生活过。","e": 6.27},{"t": 7.1,"s": "服务过横跨三大洲、四十多个国家的一千六百多名专业人才。","e": 10.925},{"t": 11.186,"s": "优越的全球视野背景，","e": 12.576},{"t": 12.836,"s": "来自三种文化里的真实生活。","e": 14.755},{"t": 15.015,"s": "这也是为什么，","e": 15.856},{"t": 16.116,"s": "Flux的第一个种子，","e": 17.314},{"t": 17.574,"s": "我敢选在海外销售端。","e": 18.988},{"t": 19.818,"s": "为海外销售，","e": 20.698},{"t": 20.958,"s": "做定制AI——","e": 22.054},{"t": 22.314,"s": "本来就是Flux这个名字的意思。","e": 24.203}]},{"n": 23,"title": "Q&A","start": 501.532,"dur": 17.648,"cues": [{"t": 0.0,"s": "Flux渗透式AI落地计划——为迎接AI世代做好准备。","e": 4.032},{"t": 4.862,"s": "还记得开场那句吗：","e": 5.969},{"t": 6.229,"s": "等它，不如准备它。","e": 7.546},{"t": 7.806,"s": "从危机，","e": 8.465},{"t": 8.725,"s": "到方法，","e": 9.309},{"t": 9.569,"s": "到种子，","e": 10.182},{"t": 10.442,"s": "到人——","e": 10.905},{"t": 11.165,"s": "这就是我们准备的完整路径。","e": 12.821},{"t": 13.651,"s": "接下来，","e": 14.195},{"t": 14.455,"s": "欢迎大家自由提问和讨论，感谢聆听。","e": 16.793},{"t": 17.053,"s": "谢谢。","e": 17.518}]}],"cues": [{"t": 0.0,"s": "各位好。","e": 0.555,"p": 1},{"t": 1.385,"s": "Flux渗透式AI落地计划——为迎接AI世代做好准备。","e": 5.417,"p": 1},{"t": 5.677,"s": "AI时代，已经不是将来时。","e": 7.537,"p": 1},{"t": 7.797,"s": "等它，","e": 8.247,"p": 1},{"t": 8.507,"s": "不如准备它。","e": 9.373,"p": 1},{"t": 9.633,"s": "Flux，就是用渗透的方式，","e": 11.271,"p": 1},{"t": 11.531,"s": "把业务养成AINative——","e": 13.21,"p": 1},{"t": 13.47,"s": "不靠一次采购，","e": 14.333,"p": 1},{"t": 14.593,"s": "不靠一场培训，","e": 15.466,"p": 1},{"t": 15.726,"s": "而是让AI一点一点，","e": 17.067,"p": 1},{"t": 17.327,"s": "渗进业务的每一天。","e": 18.617,"p": 1},{"t": 19.447,"s": "这就是今天，","e": 20.24,"p": 1},{"t": 20.5,"s": "我为各位带来的提案。","e": 21.726,"p": 1},{"t": 22.556,"s": "先看第一个数。","e": 23.452,"p": 2},{"t": 23.712,"s": "40%。","e": 24.561,"p": 2},{"t": 24.821,"s": "近四成的组织，已经部署了通用大模型工具。","e": 27.634,"p": 2},{"t": 27.894,"s": "再看第二个数。","e": 28.788,"p": 2},{"t": 29.048,"s": "5%。","e": 29.775,"p": 2},{"t": 30.035,"s": "真正跑进生产的定制企业级AI，只有百分之五。","e": 33.26,"p": 2},{"t": 34.09,"s": "一边是人人在用，","e": 35.162,"p": 2},{"t": 35.422,"s": "一边是几乎没人跑通。","e": 36.781,"p": 2},{"t": 37.041,"s": "AI的能力在按季度翻倍，","e": 38.665,"p": 2},{"t": 38.925,"s": "企业的采用曲线却几乎走平。","e": 40.923,"p": 2},{"t": 41.183,"s": "这道缺口，不会自己合上。","e": 42.893,"p": 2},{"t": 43.722,"s": "那跑通的人，做对了什么？","e": 45.3,"p": 3},{"t": 45.56,"s": "答案只有一句：","e": 46.462,"p": 3},{"t": 46.722,"s": "他们都有一个专门负责落地的人。","e": 48.633,"p": 3},{"t": 48.893,"s": "这个角色，在大厂的AI组织里已经是标配，","e": 51.927,"p": 3},{"t": 52.187,"s": "而且还在扩张。","e": 53.206,"p": 3},{"t": 53.466,"s": "因为在AI已经能写代码的今天，","e": 55.552,"p": 3},{"t": 55.812,"s": "企业缺的从来不是技术，","e": 57.246,"p": 3},{"t": 57.506,"s": "是那个把技术变成业务结果的人。","e": 59.549,"p": 3},{"t": 60.379,"s": "所以这不是要不要做的问题，","e": 62.176,"p": 3},{"t": 62.436,"s": "是多快做对的问题。","e": 63.75,"p": 3},{"t": 64.581,"s": "二零二六年五月四日，","e": 65.756,"p": 4},{"t": 66.016,"s": "两件事，同一天。","e": 67.173,"p": 4},{"t": 67.433,"s": "OpenAI成立DeploymentCompany，","e": 69.24,"p": 4},{"t": 69.5,"s": "四十亿美元募资，一百亿美元估值；","e": 71.791,"p": 4},{"t": 72.051,"s": "Anthropic联合黑石、高盛，","e": 74.007,"p": 4},{"t": 74.267,"s": "十五亿美元的企业AI合资公司。","e": 76.401,"p": 4},{"t": 77.231,"s": "同一个方向，","e": 77.979,"p": 4},{"t": 78.239,"s": "同一件事——把AI送进企业。","e": 80.232,"p": 4},{"t": 80.492,"s": "而撑起这件事的驻场工程师岗位，","e": 82.619,"p": 4},{"t": 82.879,"s": "九个月招聘量暴涨800%。","e": 84.765,"p": 4},{"t": 85.025,"s": "资本已经投票：下半场，拼的是落地。","e": 87.482,"p": 4},{"t": 88.312,"s": "落到我们自己身上，","e": 89.392,"p": 5},{"t": 89.652,"s": "被验证有效的打法，只有两条腿：","e": 91.738,"p": 5},{"t": 91.998,"s": "一，定制合用的AI工具——贴着业务做工作流；","e": 95.231,"p": 5},{"t": 95.491,"s": "二，推动全员使用——排除障碍、教会全员、用数据说话。","e": 99.448,"p": 5},{"t": 100.278,"s": "但两条腿之间，","e": 101.277,"p": 5},{"t": 101.537,"s": "隔着一条沟：","e": 102.393,"p": 5},{"t": 102.653,"s": "一边是懂业务的人，","e": 103.868,"p": 5},{"t": 104.128,"s": "一边是AI的能力。","e": 105.381,"p": 5},{"t": 105.641,"s": "沟上架什么？","e": 106.44,"p": 5},{"t": 106.7,"s": "一座桥。","e": 107.353,"p": 5},{"t": 108.183,"s": "桥一旦架起来，","e": 109.164,"p": 6},{"t": 109.424,"s": "来的就不是细水，","e": 110.606,"p": 6},{"t": 110.866,"s": "是一场浪潮。","e": 111.73,"p": 6},{"t": 112.56,"s": "大厂一年半前就开始布局，","e": 114.314,"p": 6},{"t": 114.574,"s": "洪水正在冲向每一家企业。","e": 116.286,"p": 6},{"t": 116.546,"s": "而我们始终要回答的，只有一句：","e": 118.452,"p": 6},{"t": 118.712,"s": "准备好了没有？","e": 119.542,"p": 6},{"t": 120.372,"s": "先看已经上岸的人。","e": 121.621,"p": 7},{"t": 121.881,"s": "营销——三星把广告变成AI对话推荐，","e": 124.84,"p": 7},{"t": 125.1,"s": "互动成本降54%，获客成本降73%，回报翻三倍。","e": 129.68,"p": 7},{"t": 129.94,"s": "零售——Zara用RFID加AI实时调度库存，","e": 133.571,"p": 7},{"t": 133.831,"s": "季末库存压到0.6%，","e": 135.72,"p": 7},{"t": 135.98,"s": "而行业还在百分之十到二十。","e": 137.915,"p": 7},{"t": 138.175,"s": "售后——Target给店员配AI助手，","e": 140.47,"p": 7},{"t": 140.73,"s": "上线三周，被问了五万多次。","e": 142.67,"p": 7},{"t": 143.5,"s": "三个行业，一个套路：","e": 144.801,"p": 7},{"t": 145.061,"s": "先跑通一个点，","e": 146.001,"p": 7},{"t": 146.261,"s": "再复制。","e": 146.884,"p": 7},{"t": 147.144,"s": "这就是浪潮上岸的证据。","e": 148.606,"p": 7},{"t": 149.436,"s": "回头看这张图，","e": 150.482,"p": 8},{"t": 150.742,"s": "逻辑就清楚了。","e": 151.708,"p": 8},{"t": 151.968,"s": "三星、Zara、Target，","e": 153.636,"p": 8},{"t": 153.896,"s": "没有一家是买工具买出来的，","e": 155.439,"p": 8},{"t": 155.699,"s": "都是定制加推行，两条腿一起走。","e": 158.033,"p": 8},{"t": 158.293,"s": "而连接两条腿的那座桥，","e": 159.81,"p": 8},{"t": 160.07,"s": "就是一套可复制的落地方法。","e": 161.814,"p": 8},{"t": 162.074,"s": "这套方法，","e": 162.76,"p": 8},{"t": 163.02,"s": "就是Flux的内核。","e": 164.398,"p": 8},{"t": 165.228,"s": "再回头看那两笔钱。","e": 166.587,"p": 9},{"t": 166.847,"s": "四十亿，十五亿——","e": 168.04,"p": 9},{"t": 168.3,"s": "买的不是模型，","e": 169.226,"p": 9},{"t": 169.486,"s": "是把AI送进企业的能力。","e": 171.129,"p": 9},{"t": 171.389,"s": "一次收购，就带进来一百五十名落地工程师。","e": 174.303,"p": 9},{"t": 175.133,"s": "这说明什么？","e": 175.86,"p": 9},{"t": 176.12,"s": "说明「驻场、贴业务、交结果」这套打法，","e": 178.778,"p": 9},{"t": 179.038,"s": "已经被最顶级的玩家，","e": 180.379,"p": 9},{"t": 180.639,"s": "用真金白银验证过了。","e": 182.108,"p": 9},{"t": 182.368,"s": "我们要做的，","e": 183.057,"p": 9},{"t": 183.317,"s": "是把它变成自己的。","e": 184.619,"p": 9},{"t": 185.448,"s": "所以那三张标签，","e": 186.767,"p": 10},{"t": 187.027,"s": "现在可以读得更直白：","e": 188.493,"p": 10},{"t": 188.753,"s": "已被验证——是大厂组织架构里的标配；","e": 191.376,"p": 10},{"t": 191.636,"s": "正在扩张——是招聘数据里的八百个百分点；","e": 194.323,"p": 10},{"t": 194.583,"s": "时代共识——是两大巨头同一天的下注。","e": 197.163,"p": 10},{"t": 197.993,"s": "桥的价值，已经被证明。","e": 199.576,"p": 10},{"t": 199.836,"s": "接下来的问题，只剩一个：","e": 201.44,"p": 10},{"t": 201.7,"s": "这座桥，怎么造？","e": 202.799,"p": 10},{"t": 203.63,"s": "答案就是Flux。","e": 204.852,"p": 11},{"t": 205.682,"s": "一套定制级的AINative方案。","e": 207.75,"p": 11},{"t": 208.01,"s": "Flux，","e": 208.495,"p": 11},{"t": 208.755,"s": "就是这份定制计划的名字——","e": 210.429,"p": 11},{"t": 210.689,"s": "为比亚迪海外销售，","e": 211.939,"p": 11},{"t": 212.199,"s": "把AI真正做进业务里去。","e": 214.039,"p": 11},{"t": 214.869,"s": "目标一句话：","e": 215.657,"p": 11},{"t": 215.917,"s": "让AI渗到业务的基准线。","e": 217.692,"p": 11},{"t": 217.952,"s": "不是做几个炫酷的演示，","e": 219.423,"p": 11},{"t": 219.683,"s": "而是让AI变成业务每天都离不开的底层能力。","e": 222.823,"p": 11},{"t": 223.653,"s": "Flux怎么落地？","e": 224.728,"p": 12},{"t": 224.988,"s": "靠三种职能。","e": 225.961,"p": 12},{"t": 226.221,"s": "渗透剂——从细分业务切进去，","e": 228.318,"p": 12},{"t": 228.578,"s": "把方法渗进一线每天的动作，","e": 230.466,"p": 12},{"t": 230.726,"s": "让个人经验蒸馏成组织资产。","e": 232.745,"p": 12},{"t": 233.005,"s": "催化剂——用AI啃透一个业务，","e": 235.272,"p": 12},{"t": 235.532,"s": "把成功案例凝成模板，","e": 236.957,"p": 12},{"t": 237.217,"s": "再一个个复制出去，","e": 238.507,"p": 12},{"t": 238.767,"s": "让交付周期持续缩短。","e": 240.422,"p": 12},{"t": 240.682,"s": "离析剂——全员拉齐AI基线，","e": 242.855,"p": 12},{"t": 243.115,"s": "用「使用量×业务产出」两个维度看数据，","e": 245.638,"p": 12},{"t": 245.898,"s": "最终标定出：谁该上，谁该下。","e": 248.105,"p": 12},{"t": 248.935,"s": "渗透、催化、离析，","e": 250.509,"p": 12},{"t": 250.769,"s": "三步走完，","e": 251.535,"p": 12},{"t": 251.795,"s": "业务就变成AINative。","e": 253.368,"p": 12},{"t": 254.198,"s": "再往深看一层。","e": 255.277,"p": 13},{"t": 255.537,"s": "AI时代，人的价值往哪走？","e": 257.386,"p": 13},{"t": 257.646,"s": "世界经济论坛的判断，是四个动作：","e": 259.836,"p": 13},{"t": 260.096,"s": "定义问题、设定约束、评估结果、做最终决策。","e": 263.43,"p": 13},{"t": 264.26,"s": "中间那些重复的、执行性的活，","e": 266.292,"p": 13},{"t": 266.552,"s": "会被AI吃掉。","e": 267.62,"p": 13},{"t": 267.88,"s": "人的时间，要往两端搬。","e": 269.491,"p": 13},{"t": 269.751,"s": "所以Flux要做的不是筛人，","e": 271.681,"p": 13},{"t": 271.941,"s": "是把同一个人的时间，从中段搬到两端。","e": 274.61,"p": 13},{"t": 275.44,"s": "方法有了，第一仗打在哪？","e": 277.015,"p": 14},{"t": 277.275,"s": "海外销售端。","e": 278.144,"p": 14},{"t": 278.404,"s": "三个理由。","e": 279.073,"p": 14},{"t": 279.333,"s": "一，痛点最痛——跨语言、跨时区、跨渠道，","e": 282.721,"p": 14},{"t": 282.981,"s": "报价、会议、资料同步，全靠人肉搬运。","e": 285.783,"p": 14},{"t": 286.043,"s": "二，价值可验证——销售端离用户最近，","e": 288.582,"p": 14},{"t": 288.842,"s": "AI的产出直接换成订单、转化率、响应时间，","e": 292.217,"p": 14},{"t": 292.477,"s": "当天就看得见。","e": 293.449,"p": 14},{"t": 293.709,"s": "三，闭环可复制——现场洞察反哺产品，","e": 296.514,"p": 14},{"t": 296.774,"s": "能力沿着营销、渠道、交付、风控、售后，","e": 300.034,"p": 14},{"t": 300.294,"s": "流向相邻环节。","e": 301.396,"p": 14},{"t": 302.226,"s": "跑通一个点，","e": 303.032,"p": 14},{"t": 303.292,"s": "复制一张网。","e": 304.108,"p": 14},{"t": 304.938,"s": "把整条线收一下：","e": 306.075,"p": 15},{"t": 306.335,"s": "从浮冰，","e": 306.995,"p": 15},{"t": 307.255,"s": "到洪水，","e": 307.92,"p": 15},{"t": 308.18,"s": "到Flux。","e": 308.865,"p": 15},{"t": 309.695,"s": "它最终交付四个改变：","e": 311.21,"p": 15},{"t": 311.47,"s": "业务提效——AI介入前后，数据可度量、可归因；","e": 314.859,"p": 15},{"t": 315.119,"s": "人才标定——谁能管理AI，谁会被替代，标签从模糊变精准；","e": 319.729,"p": 15},{"t": 319.989,"s": "资产沉淀——经验沉淀为公司资产，人来人走，业务质量不变；","e": 324.492,"p": 15},{"t": 324.752,"s": "流程清晰——含糊拖慢的流程，被重新梳理得高效、清楚。","e": 328.748,"p": 15},{"t": 329.008,"s": "这，","e": 329.373,"p": 15},{"t": 329.633,"s": "就是Flux渗透式AI落地计划——","e": 332.191,"p": 15},{"t": 332.451,"s": "我们为迎接AI世代，","e": 333.875,"p": 15},{"t": 334.135,"s": "交出的准备。","e": 334.953,"p": 15},{"t": 335.783,"s": "一句话收尾：","e": 336.58,"p": 16},{"t": 336.84,"s": "迎接AI世代，最好的准备，","e": 338.679,"p": 16},{"t": 338.939,"s": "就是让AI在业务里真正产出价值。","e": 341.349,"p": 16},{"t": 342.179,"s": "方案讲到这里。","e": 343.095,"p": 16},{"t": 343.355,"s": "接下来的时间，","e": 344.214,"p": 16},{"t": 344.474,"s": "请允许我用几页，","e": 345.507,"p": 16},{"t": 345.767,"s": "回答另一个问题——","e": 346.826,"p": 16},{"t": 347.086,"s": "为什么是我，来做Flux。","e": 348.65,"p": 16},{"t": 349.48,"s": "先说我怎么理解自己的角色。","e": 351.204,"p": 17},{"t": 351.464,"s": "有一句话很准：","e": 352.387,"p": 17},{"t": 352.647,"s": "我们不挖河，","e": 353.471,"p": 17},{"t": 353.731,"s": "只是在它已流过的地方，把它拓宽。","e": 355.824,"p": 17},{"t": 356.654,"s": "Flux不是凭空造一条河，","e": 358.221,"p": 17},{"t": 358.481,"s": "而是找到业务里已经在流动的部分，","e": 360.517,"p": 17},{"t": 360.777,"s": "让AI顺着它，","e": 361.948,"p": 17},{"t": 362.208,"s": "流得更宽、更快。","e": 363.442,"p": 17},{"t": 364.272,"s": "三大岗职，Dev、Delta、Echo——","e": 366.838,"p": 18},{"t": 367.098,"s": "我最匹配的，","e": 367.903,"p": 18},{"t": 368.163,"s": "就是其中的Echo。","e": 369.449,"p": 18},{"t": 370.279,"s": "帕兰提尔的第二号工程师鲍勃·麦格鲁说过：","e": 373.127,"p": 18},{"t": 373.387,"s": "Echo应该来自你所服务领域的领域专家，","e": 375.954,"p": 18},{"t": 376.214,"s": "关键特质是革新者、是异类——","e": 378.386,"p": 18},{"t": 378.646,"s": "因为对现状完全满意的人，","e": 380.224,"p": 18},{"t": 380.484,"s": "永远找不出阶跃式的变化。","e": 382.09,"p": 18},{"t": 382.92,"s": "对业务本质的理解，无法通用化，","e": 384.923,"p": 18},{"t": 385.183,"s": "只能按行业沉淀。","e": 386.355,"p": 18},{"t": 386.615,"s": "而我沉淀的行业，","e": 387.678,"p": 18},{"t": 387.938,"s": "是汽车，是用户体验。","e": 389.404,"p": 18},{"t": 390.234,"s": "为什么敢这么说？","e": 391.153,"p": 19},{"t": 391.413,"s": "看我做了二十多年的方法论就明白了。","e": 393.597,"p": 19},{"t": 393.857,"s": "设计的五步：察、定、构、验、达；","e": 396.901,"p": 19},{"t": 397.161,"s": "Echo的五步：听、判、拆、锚、推。","e": 400.227,"p": 19},{"t": 400.487,"s": "两条链子，同一个内核——","e": 402.13,"p": 19},{"t": 402.39,"s": "都不接受问题被给定的样子。","e": 404.085,"p": 19},{"t": 404.915,"s": "Echo的官方定义，是识别真正的问题；","e": 407.5,"p": 19},{"t": 407.76,"s": "设计思维里的Define，","e": 409.226,"p": 19},{"t": 409.486,"s": "做的是同一件事。","e": 410.627,"p": 19},{"t": 410.887,"s": "所以一句话：","e": 411.667,"p": 19},{"t": 411.927,"s": "用户体验的本质，","e": 412.98,"p": 19},{"t": 413.24,"s": "就是Echo。","e": 414.196,"p": 19},{"t": 415.026,"s": "再看行业履历。","e": 416.012,"p": 20},{"t": 416.272,"s": "在比亚迪，","e": 416.994,"p": 20},{"t": 417.254,"s": "我负责仰望U8、汉、唐、方程豹、海豚，","e": 420.753,"p": 20},{"t": 421.013,"s": "以及DiLink五点一、六点零、七点零的体验设计；","e": 424.362,"p": 20},{"t": 424.622,"s": "在吉利和极氪，","e": 425.604,"p": 20},{"t": 425.864,"s": "做HMI质量管理；","e": 427.333,"p": 20},{"t": 427.593,"s": "在拜腾，从UI/UX经理做到部门负责人；","e": 430.783,"p": 20},{"t": 431.043,"s": "再往前，是斑马智行的GUI设计负责人，","e": 433.83,"p": 20},{"t": 434.09,"s": "做过中国最早一批互联网车机的量产。","e": 436.513,"p": 20},{"t": 437.343,"s": "懂车机，不是懂界面，","e": 438.702,"p": 20},{"t": 438.962,"s": "是懂一台车从概念到量产，有多少道约束。","e": 441.942,"p": 20},{"t": 442.772,"s": "更重要的是，","e": 443.539,"p": 21},{"t": 443.799,"s": "这条路我已经走过一遍。","e": 445.193,"p": 21},{"t": 445.453,"s": "第一个项目：把品牌IP训练成可控的生成式资产，","e": 448.761,"p": 21},{"t": 449.021,"s": "建立视觉一致性标准——这是资产化的最小验证。","e": 452.264,"p": 21},{"t": 452.524,"s": "第二个项目：搭了一条AINative创意产线，","e": 455.231,"p": 21},{"t": 455.491,"s": "多智能体协作，从策划到打包交付——这是工序抽取的预演。","e": 459.472,"p": 21},{"t": 459.732,"s": "第三个项目：车机AI壁纸生成，","e": 461.925,"p": 21},{"t": 462.185,"s": "从概念、提示词体系到量产，全程负责——","e": 465.277,"p": 21},{"t": 465.537,"s": "这是唯一真正走完从概念到量产的AI项目。","e": 468.676,"p": 21},{"t": 469.506,"s": "三个项目都有明确的三件事：","e": 471.222,"p": 21},{"t": 471.482,"s": "谁在用、什么时候用、怎么验收。","e": 473.594,"p": 21},{"t": 473.854,"s": "这也是我对Flux的验收标准。","e": 475.669,"p": 21},{"t": 476.499,"s": "最后一页，关于我。","e": 477.714,"p": 22},{"t": 477.974,"s": "欧洲、亚洲、美洲——","e": 479.431,"p": 22},{"t": 479.691,"s": "我在三个地方，","e": 480.523,"p": 22},{"t": 480.783,"s": "都居住过、工作过、生活过。","e": 482.769,"p": 22},{"t": 483.599,"s": "服务过横跨三大洲、四十多个国家的一千六百多名专业人才。","e": 487.424,"p": 22},{"t": 487.685,"s": "优越的全球视野背景，","e": 489.075,"p": 22},{"t": 489.335,"s": "来自三种文化里的真实生活。","e": 491.254,"p": 22},{"t": 491.514,"s": "这也是为什么，","e": 492.355,"p": 22},{"t": 492.615,"s": "Flux的第一个种子，","e": 493.813,"p": 22},{"t": 494.073,"s": "我敢选在海外销售端。","e": 495.487,"p": 22},{"t": 496.317,"s": "为海外销售，","e": 497.197,"p": 22},{"t": 497.457,"s": "做定制AI——","e": 498.553,"p": 22},{"t": 498.813,"s": "本来就是Flux这个名字的意思。","e": 500.702,"p": 22},{"t": 501.532,"s": "Flux渗透式AI落地计划——为迎接AI世代做好准备。","e": 505.564,"p": 23},{"t": 506.394,"s": "还记得开场那句吗：","e": 507.501,"p": 23},{"t": 507.761,"s": "等它，不如准备它。","e": 509.078,"p": 23},{"t": 509.338,"s": "从危机，","e": 509.997,"p": 23},{"t": 510.257,"s": "到方法，","e": 510.841,"p": 23},{"t": 511.101,"s": "到种子，","e": 511.714,"p": 23},{"t": 511.974,"s": "到人——","e": 512.437,"p": 23},{"t": 512.697,"s": "这就是我们准备的完整路径。","e": 514.353,"p": 23},{"t": 515.183,"s": "接下来，","e": 515.727,"p": 23},{"t": 515.987,"s": "欢迎大家自由提问和讨论，感谢聆听。","e": 518.325,"p": 23},{"t": 518.585,"s": "谢谢。","e": 519.05,"p": 23}],"total": 519.88}</script>

/* ---------- 构建 ---------- */
const pagesEl = $('#pages');
PAGES.forEach((h,i)=>{ const d=document.createElement('div'); d.innerHTML=h; pagesEl.appendChild(d.firstElementChild); });
const pageEls = [...pagesEl.children];
const menu = $('#menu');
CUEDATA.pages.forEach((p,i)=>{
  const mi=document.createElement('div'); mi.className='mi';
  mi.innerHTML=`<b>P${i+1}</b><span>${p.title}</span>`;
  mi.onclick=()=>{ menu.classList.remove('open'); follow=true; goTo(i,true); };
  menu.appendChild(mi);
});

const vo = $('#vo'), sub = $('#subtitle'), subTxt = $('#subtitle span');
const ICON_PLAY = '<svg width="9" height="10" viewBox="0 0 9 10"><path d="M0,0 L9,5 L0,10 Z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="9" height="10" viewBox="0 0 9 10"><rect x="0" y="0" width="3" height="10" fill="currentColor"/><rect x="6" y="0" width="3" height="10" fill="currentColor"/></svg>';
function setPlayUI(playing){
  $('#progress').classList.toggle('playing', playing);
  document.querySelector('#btn-play .ic').innerHTML = playing ? ICON_PLAY : ICON_PAUSE;
  document.querySelector('#btn-play .tx').textContent = playing ? 'Playing' : 'Paused';
}
let cur=-1, subOn=true, shotMode=false, follow=true;

function setVideo(i,on){
  const v = pageEls[i].querySelector('video');
  if(v){ if(on){ v.currentTime=0; v.play().catch(()=>{}); } else v.pause(); }
}
function show(i){
  if(i===cur) return;
  if(cur>=0){ pageEls[cur].classList.remove('active'); setVideo(cur,false); }
  cur=i;
  pageEls[cur].classList.add('active'); setVideo(cur,true);
  $('#pageind').textContent = `P${i+1} / ${N}`;
  $('#ptitle').textContent = CUEDATA.pages[i].title;
}
function audioPageAt(t){
  /* v20：页边界直接用「下一页的 start」，不再用固定 +0.45s 窗口——
     段间停顿放宽到 700ms 后，固定窗口会在间隙里落空导致误跳回第 1 页 */
  const ps=CUEDATA.pages;
  for(let i=0;i<ps.length;i++){
    const end = (i+1<ps.length) ? ps[i+1].start : ps[i].start+ps[i].dur+0.45;
    if(t>=ps[i].start && t<end) return i;
  }
  return t<ps[0].start ? 0 : ps.length-1;
}
function viewPage(i){
  i=Math.max(0,Math.min(N-1,i));
  show(i);
}
function goTo(i,play){
  i=Math.max(0,Math.min(N-1,i));
  if(shotMode){ show(i); return; }
  vo.currentTime = CUEDATA.pages[i].start + 0.01;
  show(i);
  if(play){ vo.play(); }
}
/* 同步刷新：timeupdate 只有约 4Hz，会让字幕/翻页比语音晚约 0.17s；
   改为播放中逐帧（rAF，约 60Hz）驱动，暂停/跳播时仍由事件兜底。 */
let subCache='';
function syncFrame(){
  const t=vo.currentTime;
  $('#playind').textContent='\u25B6 P'+(audioPageAt(t)+1);
  $('#progress').style.width=(t/CUEDATA.total*100)+'%';
  /* 跟随模式：点了播放且用户未手动翻页时，页面自动跟随口播翻页 */
  if(follow && !vo.paused){
    const ai=audioPageAt(t);
    if(ai!==cur) show(ai);
  }
  if(subOn){
    const c=CUEDATA.cues.find(c=>t>=c.t && t<c.e);
    if(c){ if(subCache!==c.s){ subCache=c.s; subTxt.textContent=c.s; } sub.classList.add('on'); }
    else sub.classList.remove('on');
  }
}
let rafId=0;
function rafLoop(){ syncFrame(); if(!vo.paused) rafId=requestAnimationFrame(rafLoop); }
vo.addEventListener('play',()=>{ setPlayUI(true); cancelAnimationFrame(rafId); rafId=requestAnimationFrame(rafLoop); });
vo.addEventListener('pause',()=>{ setPlayUI(false); cancelAnimationFrame(rafId); syncFrame(); });
vo.addEventListener('seeked',()=>{ if(follow){ const ai=audioPageAt(vo.currentTime); if(ai!==cur) show(ai); } syncFrame(); });
vo.addEventListener('loadedmetadata',syncFrame);
vo.addEventListener('timeupdate',()=>{ if(vo.paused) syncFrame(); });

$('#btn-play').onclick=()=>{
  if(shotMode) return;
  if(vo.paused){ follow=true; show(audioPageAt(vo.currentTime)); vo.play(); }
  else vo.pause();
};
$('#btn-prev').onclick=()=>{ follow=false; viewPage(cur-1); };
$('#btn-next').onclick=()=>{ follow=false; viewPage(cur+1); };
$('#btn-sub').onclick=e=>{ subOn=!subOn; e.currentTarget.classList.toggle('off',!subOn); if(!subOn) sub.classList.remove('on'); };
$('#btn-menu').onclick=()=>menu.classList.toggle('open');
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){ follow=false; viewPage(cur-1); }
  else if(e.key==='ArrowRight'){ follow=false; viewPage(cur+1); }
  else if(e.key===' '){ e.preventDefault(); $('#btn-play').click(); }
  else if(e.key==='s'||e.key==='S') $('#btn-sub').click();
  else if(e.key==='g'||e.key==='G') menu.classList.toggle('open');
  else if(e.key==='Escape') $('#svgzoom').classList.remove('on');
});

/* 触摸滑动翻页（与播放器脱勾，仅切换视图） */
let tx0=0, ty0=0;
const stageEl=$('#stage');
stageEl.addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; },{passive:true});
stageEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ follow=false; viewPage(cur+(dx<0?1:-1)); }
},{passive:true});

/* 顶部进度条可点：跳转音频进度并同步页面（明确跟随动作） */
$('#progtrack').addEventListener('click',e=>{
  if(shotMode) return;
  const r=e.currentTarget.getBoundingClientRect();
  const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const t=ratio*CUEDATA.total;
  vo.currentTime=Math.min(t+0.01,CUEDATA.total-0.05);
  follow=true;
  show(audioPageAt(t));
});

/* P11 三张图：点击放大查看（竖屏小图可读性问题的解法） */
const zoom=$('#svgzoom');
stageEl.addEventListener('click',e=>{
  const svg=e.target.closest('[data-p="11"] .card svg');
  if(svg && !zoom.classList.contains('on')){
    zoom.innerHTML='';
    zoom.appendChild(svg.cloneNode(true));
    zoom.classList.add('on');
  } else if(zoom.classList.contains('on') && e.target.closest('#svgzoom')){
    zoom.classList.remove('on');
  }
});

const mShot=location.search.match(/shot=P(\d+)/i);
const mHash=location.hash.match(/P(\d+)/i);
if(mShot){ shotMode=true; show(parseInt(mShot[1])-1); }
else if(mHash){ goTo(parseInt(mHash[1])-1,true); }
else { show(0); }
</script>
